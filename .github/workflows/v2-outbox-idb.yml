name: V2.0 — file IndexedDB persistante (isolée)
on:
  push:
    branches: [main]
    paths:
      - 'v2/outbox-idb.js'
      - 'v2/outbox-test.html'
      - 'tests/v2-outbox-idb-browser.cjs'
      - '.github/workflows/v2-outbox-idb.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  persistent-outbox:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright — aucun navigateur vers le vrai Drive
        run: npm install --no-save playwright@1.56.1
      - name: Vérifier syntaxe du module
        run: node --check v2/outbox-idb.js
      - name: Chromium — persistance après fermeture et reprise de la file
        run: node tests/v2-outbox-idb-browser.cjs
      - name: WebKit — persistance après fermeture et reprise de la file
        env:
          MILFT_BROWSER: webkit
        run: node tests/v2-outbox-idb-browser.cjs

name: Test navigateur MILFT Tournois (developpement)
on:
  push:
    branches: [dev-championnat-monster-juniors]
  workflow_dispatch:
jobs:
  smoke-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright et Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test ouverture et erreurs JavaScript
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const { pathToFileURL } = require('url');
          const path = require('path');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
              const errors = [];
              page.on('pageerror', e => errors.push(e.message));
              // Playwright ferme les confirmations par defaut : les accepter pour creer les seances.
              page.on('dialog', dialog => dialog.accept());
              const file = path.resolve('MILFT_Tournois_V1_1_VALIDATION_HEBERGEMENT_STABLE_2026-11-02.html');
              await page.goto(pathToFileURL(file).href, { waitUntil: 'load' });
              await page.waitForTimeout(1200);
              const text = await page.locator('body').innerText();
              if (text.trim().length < 100) throw new Error('Interface vide ou non chargee');
              if (errors.length) throw new Error('Erreurs JS : ' + errors.join(' | '));
              console.log('OK : application chargee dans Chromium mobile, sans erreur JS.');
              // Verification du menu reel de creation du championnat annuel.
              await page.evaluate(() => {
                db.players = Array.from({length: 9}, (_, i) => ({id: 'auto-'+i, first: 'Test'+i, last: 'Joueur'}));
                tab = 'new';
                creationMode = 'challenge';
                render();
              });
              const selector = page.locator('#annual-format-choice');
              if (await selector.count() !== 1) throw new Error('Menu annuel absent');
              if (await page.locator('#annual-monster-form').isVisible()) throw new Error('Monster visible avant selection');
              await selector.selectOption('monster');
              if (!await page.locator('#annual-monster-form').isVisible()) throw new Error('Formulaire Monster non affiche');
              if (await page.locator('#annual-classic-form').isVisible()) throw new Error('Formulaire classique non masque');
              if (await page.locator('#annual-monster-form select[name="format"]').inputValue() !== 'bo5') throw new Error('Defaut 3 manches gagnantes absent');
              console.log('OK : menu annuel, bascule Monster et format par defaut.');
              // Parcours integre avec les vraies fonctions de l'application et stockage navigateur.
              // Utiliser le vrai formulaire et le vrai bouton, sans fabriquer un formulaire artificiel.
              await page.locator('#annual-monster-form input[name="name"]').fill('Championnat automatique');
              await page.locator('#annual-monster-form input[name="tables"]').fill('2');
              for (let i = 0; i < 8; i++) {
                await page.locator('#annual-monster-form input[name="participants"]').nth(i).check();
              }
              await page.locator('#annual-monster-form button').last().click();
              // La creation renvoie normalement a la liste des tournois en cours.
              // Ouvrir explicitement le championnat comme le ferait l'utilisateur.
              const open = page.locator('#view button:has-text("Ouvrir")');
              if (await open.count() !== 1) throw new Error('Championnat absent de la liste des tournois en cours');
              await open.click();
              if (!await page.locator('select[name="seasonPlayer"]').isVisible()) throw new Error('Ajout joueur absent de la fiche du championnat');
              const integration = await page.evaluate(() => {
                const check = (ok, label) => { if (!ok) throw new Error(label); };
                const t = active();
                check(t && t.mode === 'monster' && t.monsterMode === 'season' && t.bestOf === 5, 'Creation championnat Monster');
                // Regles decidees avec les Juniors : homonymes et manches.
                const names = {roster:[
                  {id:'a',first:'Alex',last:'Martin'},
                  {id:'b',first:'Alex',last:'Moreau'},
                  {id:'c',first:'Alex',last:'Martin'},
                  {id:'d',first:'Lea',last:'Petit'}
                ]};
                const labels = ['a','b','c','d'].map(id => milftPlayerDisplay(names,id,true));
                check(new Set(labels).size === 4, 'Homonymes non distingues dans le classement');
                check(labels[0] !== labels[2], 'Noms et prenoms identiques non distingues');
                const eight = monsterCorrectionOptions({bestOf:1,target:8},{sets:[]},0);
                check(eight.length === 8 && eight.some(x=>x.hi===8&&x.lo===7), 'Manche unique premier a 8 absente');
                const belle = monsterCorrectionOptions({bestOf:5,target:5},{sets:[
                  {a:5,b:2},{a:2,b:5},{a:5,b:1},{a:1,b:5}
                ]},4);
                check(belle.some(x=>x.hi===8&&x.lo===7), 'Belle 8-7 absente');
                console.log('OK : homonymes, manche unique a 8 et belle 8-7.');
                check(t.roster.length === 8, 'Huit joueurs inscrits depuis le formulaire');
                generateMonsterSession();
                check(t.currentRound === 1 && t.matches.length === 2, 'Generation premiere seance');
                t.matches.forEach(m => {m.status='done';m.score={a:3,b:0};m.sets=[{a:5,b:0},{a:5,b:0},{a:5,b:0}];});
                t.presence['auto-7'] = false;
                generateMonsterSession();
                check(t.currentRound === 2 && t.matches.length === 3, 'Deuxieme seance avec absent');
                const oldMatches = JSON.stringify(t.matches);
                save();
                render();
                return {id:t.id, oldMatches};
              });
              const addPlayer = page.locator('form:has(select[name="seasonPlayer"])');
              if (await addPlayer.count() !== 1) throw new Error('Formulaire ajout joueur introuvable');
              await addPlayer.locator('select[name="seasonPlayer"]').selectOption('auto-8');
              await addPlayer.locator('button').click();
              const added = await page.evaluate(({id,oldMatches}) => {
                const t = db.tournaments.find(x => x.id === id);
                return !!t && t.roster.length === 9 && t.presence['auto-8'] === false &&
                  JSON.stringify(t.matches) === oldMatches;
              }, integration);
              if (!added) throw new Error('Ajout joueur ou historique altere');
              await page.reload({waitUntil:'load'});
              const persisted = await page.evaluate(id => {
                const t = db.tournaments.find(x => x.id === id);
                return !!t && t.roster.length === 9 && t.matches.length === 3 && t.monsterMode === 'season';
              }, integration.id);
              if (!persisted) throw new Error('Sauvegarde / reprise navigateur incorrecte');
              if (errors.length) throw new Error('Erreurs JS : ' + errors.join(' | '));
              console.log('OK : creation, 2 seances, absence, ajout joueur, historique et reprise apres rechargement.');
              const ranking = await page.evaluate(() => {
                const check = (ok, msg) => { if (!ok) throw new Error(msg); };
                const t = active();
                const finished = t.matches.filter(m => m.status === 'done');
                check(finished.length === 2, 'Deux resultats termines attendus');
                const first = finished[0];
                const before = monsterStats(t);
                const a = first.teamA[0], b = first.teamB[0];
                check(before.find(p => p.id === a).pts === 2, 'Points victoire non attribues');
                check(before.find(p => p.id === b).pts === 0, 'Points defaite incorrects');
                const oldIds = t.matches.map(m => m.id);
                first.sets = [{a:0,b:5},{a:0,b:5},{a:0,b:5}];
                first.score = {a:0,b:3};
                const after = monsterStats(t);
                check(after.find(p => p.id === a).pts === 0, 'Ancien gagnant non retrograde apres correction');
                check(after.find(p => p.id === b).pts === 2, 'Nouveau gagnant non credite apres correction');
                check(after.find(p => p.id === a).diff < 0, 'Difference de buts non recalculee');
                check(t.matches.map(m => m.id).every((id,i) => id === oldIds[i]), 'Historique des rencontres modifie');
                save();
                return {id:t.id, a, b};
              });
              await page.reload({waitUntil:'load'});
              const rankingSaved = await page.evaluate(({id,a,b}) => {
                const t = db.tournaments.find(x => x.id === id);
                if (!t) return false;
                const stats = monsterStats(t);
                return stats.find(p => p.id === a).pts === 0 &&
                       stats.find(p => p.id === b).pts === 2 &&
                       t.matches.length === 3;
              }, ranking);
              if (!rankingSaved) throw new Error('Correction et classement non conserves apres rechargement');
              console.log('OK : classement individuel, inversion du vainqueur, difference de buts et sauvegarde.');
              const juniors = await page.evaluate(() => {
                const check = (ok, msg) => { if (!ok) throw new Error(msg); };
                // Championnat fictif independant : ne pas reutiliser les rencontres
                // en attente du scenario annuel precedent.
                const previous = active();
                const t = {
                  ...previous,
                  id: 'test-juniors-isole',
                  name: 'Test Juniors independant',
                  roster: previous.roster.slice(0, 8).map(p => ({...p})),
                  matches: [],
                  sessions: [],
                  currentRound: 0,
                  closed: false,
                  abandoned: false
                };
                db.tournaments.push(t);
                db.selected = t.id;
                // Parcours Juniors : rencontres generees a la demande, sans doublon de joueurs actifs.
                t.dynamicSeason = true;
                t.juniorsSessionDate = '2026-11-02';
                t.presence = Object.fromEntries(t.roster.map(p => [p.id, true]));
                const before = t.matches.length;
                milftGenerateDynamicMatch();
                milftGenerateDynamicMatch();
                check(t.matches.length === before + 2, 'Deux rencontres Juniors attendues');
                const generated = t.matches.slice(-2);
                const ids = generated.flatMap(m => [...m.teamA, ...m.teamB]);
                check(new Set(ids).size === 8, 'Joueur affecte simultanement a deux rencontres');
                milftGenerateDynamicMatch();
                check(t.matches.length === before + 2, 'Une troisieme rencontre ne doit pas utiliser les joueurs occupes');
                check(generated.every(m => m.sessionDate === '2026-11-02'), 'Date de seance Juniors incorrecte');
                // Changer de date ne doit ni liberer les joueurs occupes ni effacer les presences.
                t.juniorsPresences = {'2026-11-02': {...t.presence}};
                milftChangeJuniorsDate('2026-11-09');
                check(Object.values(t.presence).every(v => v === false), 'Nouvelle journee non initialisee absente');
                setAllMonsterPresence(true);
                milftGenerateDynamicMatch();
                check(t.matches.length === before + 2, 'Joueur deja occupe reutilise sur une autre date');
                milftChangeJuniorsDate('2026-11-02');
                check(Object.values(t.presence).every(v => v === true), 'Presences de la premiere date perdues');
                milftChangeJuniorsDate('2026-11-09');
                check(Object.values(t.presence).every(v => v === true), 'Presences de la seconde date perdues');
                save();
                return { before, total: t.matches.length, originalId: previous.id,
                  originalMatches: JSON.stringify(previous.matches), juniorsId: t.id };
              });
              if (juniors.total !== juniors.before + 2) throw new Error('Parcours Juniors incorrect');
              await page.reload({waitUntil:'load'});
              const isolated = await page.evaluate(({originalId,originalMatches,juniorsId,total}) => {
                const original = db.tournaments.find(t => t.id === originalId);
                const juniors = db.tournaments.find(t => t.id === juniorsId);
                return !!original && !!juniors &&
                  JSON.stringify(original.matches) === originalMatches &&
                  juniors.matches.length === total &&
                  juniors.juniorsPresences['2026-11-02'] &&
                  juniors.juniorsPresences['2026-11-09'] &&
                  juniors.juniorsSessionDate === '2026-11-09';
              }, juniors);
              if (!isolated) throw new Error('Isolation des championnats ou reprise des presences Juniors incorrecte');
              console.log('OK : championnats independants et presences Juniors sauvegardees apres rechargement.');
              if (errors.length) throw new Error('Erreurs JS : ' + errors.join(' | '));
              console.log('OK : generation Juniors a la demande, sans joueur simultane ni troisieme rencontre.');

              await page.screenshot({ path: 'milft-smoke.png', fullPage: true });
            } catch (e) {
              console.error('ECHEC CHROMIUM :', e.message);
              console.error('Page actuelle :', page.url());
              try {
                console.error('Etat du formulaire ajout :', await page.locator('select[name="seasonPlayer"]').count());
                console.error('Texte visible :', (await page.locator('body').innerText()).slice(0, 1800));
                await page.screenshot({ path: 'milft-smoke.png', fullPage: true });
                console.error('Capture de diagnostic enregistree.');
              } catch (diagnosticError) { console.error('Diagnostic impossible :', diagnosticError.message); }
              throw e;
            } finally { await browser.close(); }
          })().catch(e => { console.error(e); process.exit(1); });
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-milft-chromium
          path: milft-smoke.png

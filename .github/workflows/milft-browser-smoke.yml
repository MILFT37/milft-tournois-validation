name: Test navigateur MILFT Tournois (developpement)
on:
  push:
    branches: [dev-championnat-monster-juniors]
  workflow_dispatch:
jobs:
  smoke-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright et Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verifier la syntaxe de tous les scripts embarques
        run: |
          node <<'JS'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('MILFT_Tournois_V1_1_VALIDATION_HEBERGEMENT_STABLE_2026-11-02.html','utf8');
          const scripts=html.split('<script').slice(1).map(part=>part.slice(part.indexOf('>')+1,part.indexOf('</script>'))).filter(Boolean);
          if(scripts.length<2)throw Error('Scripts embarques introuvables');
          scripts.forEach((source,i)=>{try{new vm.Script(source,{filename:'script-'+i+'.js'});}catch(e){console.error('Erreur de syntaxe script '+i);throw e;}});
          console.log('OK : '+scripts.length+' blocs JavaScript sans erreur de syntaxe.');
          JS
      - name: Test ouverture et erreurs JavaScript
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const { pathToFileURL } = require('url');
          const path = require('path');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            let page;
            try {
              page = await browser.newPage({ viewport: { width: 390, height: 844 } });
              const errors = [];
              page.on('pageerror', e => errors.push(e.message));
              // Playwright ferme les confirmations par defaut : les accepter pour creer les seances.
              page.on('dialog', dialog => dialog.accept());
              const file = path.resolve('MILFT_Tournois_V1_1_VALIDATION_HEBERGEMENT_STABLE_2026-11-02.html');
              await page.goto(pathToFileURL(file).href, { waitUntil: 'load' });
              await page.waitForTimeout(1200);
              const text = await page.locator('body').innerText();
              if (text.trim().length < 100) throw new Error('Interface vide ou non chargee');
              if (errors.length) throw new Error('Erreurs JS : ' + errors.join(' | '));
              console.log('OK : application chargee dans Chromium mobile, sans erreur JS.');
              // Verification du menu reel de creation du championnat annuel.
              await page.evaluate(() => {
                db.players = Array.from({length: 9}, (_, i) => ({id: 'auto-'+i, first: 'Test'+i, last: 'Joueur'}));
                tab = 'new';
                creationMode = 'challenge';
                render();
              });
              const selector = page.locator('#annual-format-choice');
              if (await selector.count() !== 1) throw new Error('Menu annuel absent');
              if (await page.locator('#annual-monster-form').isVisible()) throw new Error('Monster visible avant selection');
              await selector.selectOption('monster');
              if (!await page.locator('#annual-monster-form').isVisible()) throw new Error('Formulaire Monster non affiche');
              if (await page.locator('#annual-classic-form').isVisible()) throw new Error('Formulaire classique non masque');
              if (await page.locator('#annual-monster-form select[name="format"]').inputValue() !== 'bo5') throw new Error('Defaut 3 manches gagnantes absent');
              console.log('OK : menu annuel, bascule Monster et format par defaut.');
              // Parcours integre avec les vraies fonctions de l'application et stockage navigateur.
              // Utiliser le vrai formulaire et le vrai bouton, sans fabriquer un formulaire artificiel.
              await page.locator('#annual-monster-form input[name="name"]').fill('Championnat automatique');
              await page.locator('#annual-monster-form input[name="tables"]').fill('2');
              for (let i = 0; i < 8; i++) {
                await page.locator('#annual-monster-form input[name="participants"]').nth(i).check();
              }
              await page.locator('#annual-monster-form button').last().click();
              // La creation renvoie normalement a la liste des tournois en cours.
              // Ouvrir explicitement le championnat comme le ferait l'utilisateur.
              const open = page.locator('#view button:has-text("Ouvrir")');
              if (await open.count() !== 1) throw new Error('Championnat absent de la liste des tournois en cours');
              await open.click();
              if (!await page.locator('select[name="seasonPlayer"]').isVisible()) throw new Error('Ajout joueur absent de la fiche du championnat');
              const integration = await page.evaluate(() => {
                const check = (ok, label) => { if (!ok) throw new Error(label); };
                const t = active();
                check(t && t.mode === 'monster' && t.monsterMode === 'season' && t.bestOf === 5, 'Creation championnat Monster');
                // Regles decidees avec les Juniors : homonymes et manches.
                const names = {roster:[
                  {id:'a',first:'Alex',last:'Martin'},
                  {id:'b',first:'Alex',last:'Moreau'},
                  {id:'c',first:'Alex',last:'Martin'},
                  {id:'d',first:'Lea',last:'Petit'}
                ]};
                const labels = ['a','b','c','d'].map(id => milftPlayerDisplay(names,id,true));
                check(new Set(labels).size === 4, 'Homonymes non distingues dans le classement');
                check(labels[0] !== labels[2], 'Noms et prenoms identiques non distingues');
                const eight = monsterCorrectionOptions({bestOf:1,target:8},{sets:[]},0);
                check(eight.length === 8 && eight.some(x=>x.hi===8&&x.lo===7), 'Manche unique premier a 8 absente');
                const belle = monsterCorrectionOptions({bestOf:5,target:5},{sets:[
                  {a:5,b:2},{a:2,b:5},{a:5,b:1},{a:1,b:5}
                ]},4);
                check(belle.some(x=>x.hi===8&&x.lo===7), 'Belle 8-7 absente');
                console.log('OK : homonymes, manche unique a 8 et belle 8-7.');
                check(t.roster.length === 8, 'Huit joueurs inscrits depuis le formulaire');
                generateMonsterSession();
                check(t.currentRound === 1 && t.matches.length === 2, 'Generation premiere seance');
                t.matches.forEach(m => {m.status='done';m.score={a:3,b:0};m.sets=[{a:5,b:0},{a:5,b:0},{a:5,b:0}];});
                t.presence['auto-7'] = false;
                generateMonsterSession();
                check(t.currentRound === 2 && t.matches.length === 3, 'Deuxieme seance avec absent');
                const oldMatches = JSON.stringify(t.matches);
                save();
                render();
                return {id:t.id, oldMatches};
              });
              const addPlayer = page.locator('form:has(select[name="seasonPlayer"])');
              if (await addPlayer.count() !== 1) throw new Error('Formulaire ajout joueur introuvable');
              await addPlayer.locator('select[name="seasonPlayer"]').selectOption('auto-8');
              await addPlayer.locator('button').click();
              const added = await page.evaluate(({id,oldMatches}) => {
                const t = db.tournaments.find(x => x.id === id);
                return !!t && t.roster.length === 9 && t.presence['auto-8'] === false &&
                  JSON.stringify(t.matches) === oldMatches;
              }, integration);
              if (!added) throw new Error('Ajout joueur ou historique altere');
              await page.reload({waitUntil:'load'});
              const persisted = await page.evaluate(id => {
                const t = db.tournaments.find(x => x.id === id);
                return !!t && t.roster.length === 9 && t.matches.length === 3 && t.monsterMode === 'season';
              }, integration.id);
              if (!persisted) throw new Error('Sauvegarde / reprise navigateur incorrecte');
              if (errors.length) throw new Error('Erreurs JS : ' + errors.join(' | '));
              console.log('OK : creation, 2 seances, absence, ajout joueur, historique et reprise apres rechargement.');
              const ranking = await page.evaluate(() => {
                const check = (ok, msg) => { if (!ok) throw new Error(msg); };
                const t = active();
                const finished = t.matches.filter(m => m.status === 'done');
                check(finished.length === 2, 'Deux resultats termines attendus');
                const first = finished[0];
                const before = monsterStats(t);
                const a = first.teamA[0], b = first.teamB[0];
                check(before.find(p => p.id === a).pts === 2, 'Points victoire non attribues');
                check(before.find(p => p.id === b).pts === 0, 'Points defaite incorrects');
                const oldIds = t.matches.map(m => m.id);
                first.sets = [{a:0,b:5},{a:0,b:5},{a:0,b:5}];
                first.score = {a:0,b:3};
                const after = monsterStats(t);
                check(after.find(p => p.id === a).pts === 0, 'Ancien gagnant non retrograde apres correction');
                check(after.find(p => p.id === b).pts === 2, 'Nouveau gagnant non credite apres correction');
                check(after.find(p => p.id === a).diff < 0, 'Difference de buts non recalculee');
                check(t.matches.map(m => m.id).every((id,i) => id === oldIds[i]), 'Historique des rencontres modifie');
                save();
                return {id:t.id, a, b};
              });
              await page.reload({waitUntil:'load'});
              const rankingSaved = await page.evaluate(({id,a,b}) => {
                const t = db.tournaments.find(x => x.id === id);
                if (!t) return false;
                const stats = monsterStats(t);
                return stats.find(p => p.id === a).pts === 0 &&
                       stats.find(p => p.id === b).pts === 2 &&
                       t.matches.length === 3;
              }, ranking);
              if (!rankingSaved) throw new Error('Correction et classement non conserves apres rechargement');
              console.log('OK : classement individuel, inversion du vainqueur, difference de buts et sauvegarde.');
              const juniors = await page.evaluate(() => {
                const check = (ok, msg) => { if (!ok) throw new Error(msg); };
                // Championnat fictif independant : ne pas reutiliser les rencontres
                // en attente du scenario annuel precedent.
                const previous = active();
                const t = {
                  ...previous,
                  id: 'test-juniors-isole',
                  name: 'Test Juniors independant',
                  roster: previous.roster.slice(0, 8).map(p => ({...p})),
                  matches: [],
                  sessions: [],
                  currentRound: 0,
                  closed: false,
                  abandoned: false
                };
                db.tournaments.push(t);
                db.selected = t.id;
                // Parcours Juniors : rencontres generees a la demande, sans doublon de joueurs actifs.
                t.dynamicSeason = true;
                t.juniorsSessionDate = '2026-11-02';
                t.presence = Object.fromEntries(t.roster.map(p => [p.id, true]));
                const before = t.matches.length;
                milftGenerateDynamicMatch();
                milftGenerateDynamicMatch();
                check(t.matches.length === before + 2, 'Deux rencontres Juniors attendues');
                const generated = t.matches.slice(-2);
                const ids = generated.flatMap(m => [...m.teamA, ...m.teamB]);
                check(new Set(ids).size === 8, 'Joueur affecte simultanement a deux rencontres');
                milftGenerateDynamicMatch();
                check(t.matches.length === before + 2, 'Une troisieme rencontre ne doit pas utiliser les joueurs occupes');
                check(generated.every(m => m.sessionDate === '2026-11-02'), 'Date de seance Juniors incorrecte');
                // Changer de date ne doit ni liberer les joueurs occupes ni effacer les presences.
                t.juniorsPresences = {'2026-11-02': {...t.presence}};
                milftChangeJuniorsDate('2026-11-09');
                check(Object.values(t.presence).every(v => v === false), 'Nouvelle journee non initialisee absente');
                setAllMonsterPresence(true);
                milftGenerateDynamicMatch();
                check(t.matches.length === before + 2, 'Joueur deja occupe reutilise sur une autre date');
                milftChangeJuniorsDate('2026-11-02');
                check(Object.values(t.presence).every(v => v === true), 'Presences de la premiere date perdues');
                milftChangeJuniorsDate('2026-11-09');
                check(Object.values(t.presence).every(v => v === true), 'Presences de la seconde date perdues');
                // Une fois les rencontres terminees, la saison doit pouvoir continuer
                // meme lorsque toutes les associations de partenaires ont deja ete utilisees.
                for (const m of generated) {
                  m.status = 'done';
                  m.score = {a:2,b:0};
                  m.sets = [{a:5,b:2},{a:5,b:3}];
                }
                for (let round = 0; round < 18; round++) {
                  const prior = t.matches.length;
                  milftGenerateDynamicMatch();
                  check(t.matches.length === prior + 1, 'Saison Juniors bloquee apres epuisement des binomes, tour ' + round);
                  const m = t.matches[t.matches.length - 1];
                  check(new Set([...m.teamA,...m.teamB]).size === 4, 'Joueurs repetes dans une rencontre');
                  m.status = 'done';
                  m.score = {a:2,b:0};
                  m.sets = [{a:5,b:1},{a:5,b:2}];
                }
                const standings = monsterStats(t);
                check(standings.length === 8, 'Classement Juniors incomplet apres 18 tours');
                check(standings.every(p => p.played > 0), 'Joueur Juniors jamais classe');
                // Chaque rencontre finie attribue deux points a chacun des deux gagnants.
                const played = standings.reduce((sum,p) => sum + p.played, 0);
                const points = standings.reduce((sum,p) => sum + p.pts, 0);
                const difference = standings.reduce((sum,p) => sum + p.diff, 0);
                check(played === t.matches.length * 4, 'Total des participations incorrect');
                check(points === t.matches.length * 4, 'Total des points du classement incorrect');
                check(difference === 0, 'Difference de buts globale non equilibree');
                save();
                return { before, total: t.matches.length, originalId: previous.id,
                  originalMatches: JSON.stringify(previous.matches), juniorsId: t.id };
              });
              if (juniors.total !== juniors.before + 20) throw new Error('Parcours Juniors incorrect : '+juniors.total+' rencontres obtenues, '+(juniors.before+20)+' attendues');
              await page.reload({waitUntil:'load'});
              const isolated = await page.evaluate(({originalId,originalMatches,juniorsId,total}) => {
                const original = db.tournaments.find(t => t.id === originalId);
                const juniors = db.tournaments.find(t => t.id === juniorsId);
                return !!original && !!juniors &&
                  JSON.stringify(original.matches) === originalMatches &&
                  juniors.matches.length === total &&
                  juniors.juniorsPresences['2026-11-02'] &&
                  juniors.juniorsPresences['2026-11-09'] &&
                  juniors.juniorsSessionDate === '2026-11-09';
              }, juniors);
              if (!isolated) throw new Error('Isolation des championnats ou reprise des presences Juniors incorrecte');
              console.log('OK : championnats independants et presences Juniors sauvegardees apres rechargement.');
              if (errors.length) throw new Error('Erreurs JS : ' + errors.join(' | '));
              console.log('OK : generation Juniors a la demande, sans joueur simultane ni troisieme rencontre.');

              // Controle visuel et fonctionnel du bandeau Course aux points
              // pour une rencontre simple puis une competition de clubs.
              await page.evaluate(() => {
                const t = {
                  id:'test-cap-simple',name:'Course simple TEST',date:'2026-11-02',
                  mode:'cap',closed:false,abandoned:false,matches:[],tables:[],
                  cap:{teamA:'MILFT',teamB:'Adversaire',targets:[5,10],types:['S','D'],
                       relays:[],finish:'first',scoreMode:'cumulative'}
                };
                db.tournaments.push(t);db.selected=t.id;tab='live-detail';save();render();
              });
              const capHeader = page.locator('.milft-cap-header');
              if (await capHeader.count() !== 1) throw new Error('Bandeau CAP simple absent');
              const capButtons = await capHeader.locator('.milft-cap-actions button').allTextContents();
              if (capButtons.length !== 4 ||
                  !capButtons[2].includes('Terminer') ||
                  !capButtons[3].includes('Abandonner'))
                throw new Error('Grille CAP simple non conforme');
              await page.screenshot({ path: 'milft-cap-simple.png', fullPage: true });
              const capCols = await capHeader.locator('.milft-cap-actions').evaluate(el =>
                getComputedStyle(el).gridTemplateColumns.split(' ').length);
              if (capCols !== 2) throw new Error('CAP simple : grille non repartie en deux colonnes');
              await page.evaluate(() => {
                const t={
                  id:'test-cap-clubs',name:'Course clubs TEST',date:'2026-11-02',
                  mode:'cap',closed:false,abandoned:false,matches:[],tables:[],
                  cap:{competition:true,structure:'league',phase:'league',matches:[],
                       clubs:[{id:'c1',name:'Club 1'},{id:'c2',name:'Club 2'}],
                       rosters:{c1:[],c2:[]},targets:[5,10],types:['S','D']}
                };
                db.tournaments.push(t);
                db.selected=t.id;
                save();render();
              });
              if (await capHeader.count() !== 1) throw new Error('Bandeau CAP clubs absent');
              const clubButtons = await capHeader.locator('.milft-cap-actions button').allTextContents();
              if (clubButtons.length !== 4 ||
                  !clubButtons[2].includes('Terminer') ||
                  !clubButtons[3].includes('Abandonner'))
                throw new Error('Grille CAP clubs non conforme');
              // Le bandeau doit etre la premiere carte et preceder les effectifs.
              const capLayout = await page.evaluate(() => {
                const view=document.querySelector('#view');
                const cards=[...view.querySelectorAll(':scope > .card')];
                const header=document.querySelector('.milft-cap-header');
                const roster=document.querySelector('.cap-roster-card');
                const grid=document.querySelector('.milft-cap-actions');
                const buttons=[...grid.querySelectorAll('button')];
                return {first:cards[0]===header,cardOrder:cards.slice(0,5).map(c=>c.className+' : '+c.textContent.trim().slice(0,45)),headerCount:document.querySelectorAll('.milft-cap-header').length,rosterAfter:!!roster&&Boolean(header.compareDocumentPosition(roster)&Node.DOCUMENT_POSITION_FOLLOWING),
                  labels:buttons.map(b=>b.textContent.trim()),columns:getComputedStyle(grid).gridTemplateColumns.split(' ').length};
              });
              if (!capLayout.first || !capLayout.rosterAfter || capLayout.columns!==2)
                throw new Error('CAP clubs : bandeau, effectifs ou colonnes mal positionnes : '+JSON.stringify(capLayout));
              if (!capLayout.labels[2].includes('Terminer') || !capLayout.labels[3].includes('Abandonner'))
                throw new Error('CAP clubs : boutons de seconde ligne incorrects');
              // Controle geometrique mobile : deux rangees et aucun bouton coupe.
              const capGeometry = await page.locator('.milft-cap-actions').evaluate(grid => {
                const buttons=[...grid.querySelectorAll('button')];
                const rects=buttons.map(b=>b.getBoundingClientRect());
                const viewport=document.documentElement.clientWidth;
                return {
                  viewport,documentWidth:document.documentElement.scrollWidth,
                  rows:rects.map(r=>Math.round(r.top)),
                  visible:rects.every(r=>r.width>40&&r.left>=0&&r.right<=viewport+1),
                  firstRow:Math.abs(rects[0].top-rects[1].top)<2,
                  secondRow:Math.abs(rects[2].top-rects[3].top)<2,
                  below:rects[2].top>rects[0].bottom
                };
              });
              if (!capGeometry.visible||!capGeometry.firstRow||
                  !capGeometry.secondRow||!capGeometry.below||
                  capGeometry.documentWidth>capGeometry.viewport+1)
                throw new Error('CAP clubs : geometrie mobile incorrecte : '+JSON.stringify(capGeometry));
              await page.screenshot({ path: 'milft-cap-clubs.png', fullPage: true });
              await page.reload({ waitUntil: 'load' });
              await page.evaluate(() => { db.selected='test-cap-clubs';tab='live-detail';render(); });
              if (await page.locator('.milft-cap-header').count() !== 1)
                throw new Error('Bandeau CAP clubs absent apres rechargement');
              const saved = await page.evaluate(() => db.tournaments.filter(t =>
                ['test-cap-simple','test-cap-clubs'].includes(t.id)).map(t=>t.id));
              if (saved.length !== 2 || !saved.includes('test-cap-simple') || !saved.includes('test-cap-clubs'))
                throw new Error('Les deux courses CAP ne sont pas sauvegardees independamment');
              // Abandon CAP clubs : le compteur doit utiliser les rencontres CAP,
              // et non la liste des matchs du tournoi classique.
              const capAbandonCount = await page.evaluate(() => {
                const t=active();
                const pending=t.cap.matches.filter(m=>m.status!=='done').length;
                const classic=t.matches.filter(m=>m.status!=='done').length;
                return {pending,classic};
              });
              if (capAbandonCount.pending!==0 || capAbandonCount.classic!==0)
                throw new Error('CAP clubs : etat initial inattendu');
              // Verifier que les clotures incompletes sont refusees.
              const capCloseGuard = await page.evaluate(() => {
                const t=active();
                t.cap.matches.push({id:'cap-pending',a:'c1',b:'c2',phase:'league',status:'waiting',relays:[]});
                save();
                capCompClose();
                return t.closed;
              });
              if (capCloseGuard) throw new Error('CAP clubs : cloture prematuree autorisee');
              await page.evaluate(() => {
                db.selected='test-cap-simple';
                const t=active();
                capClose();
                if (t.closed) throw new Error('CAP simple : cloture avant tous les relais');
                db.selected='test-cap-clubs';render();
              });
              console.log('OK : cloture impossible avant la fin des relais et des rencontres.');
              console.log('OK : bandeaux Course aux points, grille deux colonnes, commandes Terminer et Abandonner.');
              await page.screenshot({ path: 'milft-smoke.png', fullPage: true });
              // Les commandes restent utilisables et le bandeau CAP simple
              // conserve son alignement apres une reprise.
              await page.evaluate(() => {db.selected='test-cap-simple';tab='live-detail';render();});
              const simpleGeometry = await page.locator('.milft-cap-actions').evaluate(grid => {
                const rects=[...grid.querySelectorAll('button')].map(b=>b.getBoundingClientRect());
                return {count:rects.length,firstRow:Math.abs(rects[0].top-rects[1].top)<2,
                  secondRow:Math.abs(rects[2].top-rects[3].top)<2,
                  secondBelow:rects[2].top>rects[0].bottom,
                  withinViewport:rects.every(r=>r.left>=0&&r.right<=document.documentElement.clientWidth+1)};
              });
              if (simpleGeometry.count!==4 || !simpleGeometry.firstRow ||
                  !simpleGeometry.secondRow || !simpleGeometry.secondBelow ||
                  !simpleGeometry.withinViewport)
                throw new Error('CAP simple : geometrie mobile incorrecte : '+JSON.stringify(simpleGeometry));
              // Le bandeau de securite TEST doit defiler et ne pas recouvrir les commandes.
              const testBanner = await page.evaluate(() => {
                const el=document.querySelector('#milft-iso-warning');
                if(!el) return {exists:false};
                const position=getComputedStyle(el).position;
                window.scrollTo(0, Math.min(400,document.documentElement.scrollHeight-innerHeight));
                return {exists:true,position,top:el.getBoundingClientRect().top,scrollY:window.scrollY};
              });
              if (!testBanner.exists || testBanner.position==='sticky' || testBanner.position==='fixed' ||
                  (testBanner.scrollY>100 && testBanner.top>=0))
                throw new Error('Bandeau TEST masque encore le contenu mobile : '+JSON.stringify(testBanner));
              console.log('OK : bandeau TEST defilant, sans superposition permanente.');
              // Verification mobile reelle : le dernier contenu reste accessible
              // au-dessus de la navigation fixe apres defilement en bas.
              const bottomVisibility = await page.evaluate(() => {
                window.scrollTo(0, document.documentElement.scrollHeight);
                const nav=document.querySelector('#milft-quicknav');
                const navRect=nav?.getBoundingClientRect();
                const navVisible=!!navRect && getComputedStyle(nav).display!=='none';
                const bodyPadding=parseFloat(getComputedStyle(document.body).paddingBottom)||0;
                const navHeight=navRect?.height||0;
                const actualScrollEnd=Math.abs(window.scrollY+innerHeight-document.documentElement.scrollHeight);
                return {navVisible,navHeight,bodyPadding,actualScrollEnd,
                  viewportHeight:innerHeight,scrollY:scrollY,scrollHeight:document.documentElement.scrollHeight};
              });
              if (!bottomVisibility.navVisible || bottomVisibility.navHeight<=0 ||
                  bottomVisibility.bodyPadding<bottomVisibility.navHeight+12 ||
                  bottomVisibility.actualScrollEnd>3)
                throw new Error('Mobile : marge basse ou defilement incorrect : '+JSON.stringify(bottomVisibility));
              console.log('OK : marge basse superieure a la hauteur de navigation mobile.');
              await page.screenshot({path:'milft-cap-simple-bas-ecran.png'});
              await page.evaluate(() => {db.selected='test-cap-clubs';render();});
              // Meme geometrie et meme ordre des commandes pour Course clubs.
              const clubsGeometry = await page.locator('.milft-cap-actions').evaluate(grid => {
                const buttons=[...grid.querySelectorAll('button')];
                const rects=buttons.map(b=>b.getBoundingClientRect());
                return {count:buttons.length,
                  labels:buttons.map(b=>b.textContent.trim()),
                  firstRow:rects.length===4&&Math.abs(rects[0].top-rects[1].top)<2,
                  secondRow:rects.length===4&&Math.abs(rects[2].top-rects[3].top)<2,
                  secondBelow:rects.length===4&&rects[2].top>rects[0].bottom,
                  withinViewport:rects.every(r=>r.left>=0&&r.right<=document.documentElement.clientWidth+1)};
              });
              if (clubsGeometry.count!==4 || !clubsGeometry.firstRow ||
                  !clubsGeometry.secondRow || !clubsGeometry.secondBelow ||
                  !clubsGeometry.withinViewport ||
                  clubsGeometry.labels[2]!=='Terminer' || clubsGeometry.labels[3]!=='Abandonner')
                throw new Error('CAP clubs : grille mobile non conforme : '+JSON.stringify(clubsGeometry));
              console.log('OK : grille CAP clubs deux lignes, quatre boutons visibles.');
              // Non-regression : un abandon annule ne doit jamais archiver.
              const capCancelGuard = await page.evaluate(() => {
                db.selected='test-cap-clubs';render();
                const t=active();
                const button=document.querySelector('.milft-cap-header .milft-cap-actions button.danger');
                if (!button) throw new Error('Bouton Abandonner CAP absent');
                const oldConfirm=window.confirm, oldPrompt=window.prompt;
                let confirms=0, prompts=0;
                try {
                  window.confirm=()=>{confirms++;return false;};
                  window.prompt=()=>{prompts++;return 'ABANDONNER';};
                  button.click();
                } finally {window.confirm=oldConfirm;window.prompt=oldPrompt;}
                return {confirms,prompts,closed:t.closed,abandoned:t.abandoned};
              });
              if (capCancelGuard.confirms!==1 || capCancelGuard.prompts!==0 ||
                  capCancelGuard.closed || capCancelGuard.abandoned)
                throw new Error('CAP clubs : annulation de confirmation non respectee : '+JSON.stringify(capCancelGuard));
              const capPromptGuard = await page.evaluate(() => {
                const t=active();
                const button=document.querySelector('.milft-cap-header .milft-cap-actions button.danger');
                const oldConfirm=window.confirm, oldPrompt=window.prompt;
                let confirms=0, prompts=0;
                try {
                  window.confirm=()=>{confirms++;return true;};
                  window.prompt=()=>{prompts++;return null;};
                  button.click();
                } finally {window.confirm=oldConfirm;window.prompt=oldPrompt;}
                return {confirms,prompts,closed:t.closed,abandoned:t.abandoned};
              });
              if (capPromptGuard.confirms!==1 || capPromptGuard.prompts!==1 ||
                  capPromptGuard.closed || capPromptGuard.abandoned)
                throw new Error('CAP clubs : annulation de seconde confirmation non respectee : '+JSON.stringify(capPromptGuard));
              console.log('OK : les deux annulations de confirmation conservent la competition.');
              // Un match CAP en cours doit etre libere lors de l'abandon.
              await page.evaluate(() => {
                const t=active();
                const pending=t.cap.matches.find(m=>m.id==='cap-pending');
                pending.status='playing';
                pending.tableId=1;
                save();render();
              });
              // Regression reelle : la confirmation d'abandon CAP clubs doit
              // annoncer 1 rencontre restante, puis archiver la competition.
              const capAbandonGuard = await page.evaluate(() => {
                db.selected='test-cap-clubs';
                const t=active();
                let confirmation='';
                const originalConfirm=window.confirm;
                const originalPrompt=window.prompt;
                window.confirm=message=>{confirmation=message;return true;};
                window.prompt=()=> 'ABANDONNER';
                try {
                  const button=document.querySelector('.milft-cap-header .milft-cap-actions button.danger');
                  if (!button) throw new Error('Bouton Abandonner CAP introuvable');
                  button.click();
                }
                finally { window.confirm=originalConfirm;window.prompt=originalPrompt; }
                return {confirmation,closed:t.closed,abandoned:t.abandoned,
                  capPending:t.cap.matches.filter(m=>m.status!=='done').length,capMatchStatus:t.cap.matches[0].status,capTableId:t.cap.matches[0].tableId};
              });
              if (!capAbandonGuard.confirmation.includes('1 rencontre(s) non terminée(s)') ||
                  !capAbandonGuard.closed || !capAbandonGuard.abandoned ||
                  capAbandonGuard.capPending!==1 || capAbandonGuard.capMatchStatus!=='waiting' || capAbandonGuard.capTableId!==null)
                throw new Error('CAP clubs : abandon ou compteur de rencontres incorrect : '+JSON.stringify(capAbandonGuard));
              console.log('OK : abandon CAP clubs, confirmation du nombre de rencontres et archivage.');
              await page.screenshot({ path: 'milft-cap-clubs-abandonne.png', fullPage: true });
              // Persistance apres rechargement : le tournoi abandonne reste archive,
              // sa rencontre ne redemarre pas et la table est liberee.
              await page.reload({waitUntil:'load'});
              const abandonedPersisted = await page.evaluate(() => {
                const t=db.tournaments.find(x=>x.id==='test-cap-clubs');
                const m=t?.cap?.matches?.find(x=>x.id==='cap-pending');
                return {exists:!!t,closed:t?.closed,abandoned:t?.abandoned,
                  status:m?.status,tableId:m?.tableId,selected:db.selected};
              });
              if (!abandonedPersisted.exists || !abandonedPersisted.closed ||
                  !abandonedPersisted.abandoned || abandonedPersisted.status!=='waiting' ||
                  abandonedPersisted.tableId!==null)
                throw new Error('CAP clubs : sauvegarde de l\'abandon incorrecte : '+JSON.stringify(abandonedPersisted));
              console.log('OK : abandon CAP conserve apres rechargement, match arrete et table liberee.');


            } catch (e) {
              console.error('ECHEC CHROMIUM :', e.message);
              console.error('Page actuelle :', page ? page.url() : 'non ouverte');
              try {
                if (!page) throw new Error('Page non initialisee');
                console.error('Etat du formulaire ajout :', await page.locator('select[name="seasonPlayer"]').count());
                console.error('Texte visible :', (await page.locator('body').innerText()).slice(0, 1800));
                await page.screenshot({ path: 'milft-smoke.png', fullPage: true });
                console.error('Capture de diagnostic enregistree.');
              } catch (diagnosticError) { console.error('Diagnostic impossible :', diagnosticError.message); }
              throw e;
            } finally { await browser.close(); }
          })().catch(e => { console.error(e); process.exit(1); });
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-milft-chromium
          path: |
            milft-smoke.png
            milft-cap-simple.png
            milft-cap-simple-bas-ecran.png
            milft-cap-clubs.png
            milft-cap-clubs-abandonne.png

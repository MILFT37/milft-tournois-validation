name: Test navigateur MILFT Tournois (developpement)
on:
  push:
    branches: [dev-championnat-monster-juniors]
  workflow_dispatch:
jobs:
  smoke-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright et Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test ouverture et erreurs JavaScript
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const { pathToFileURL } = require('url');
          const path = require('path');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
              const errors = [];
              page.on('pageerror', e => errors.push(e.message));
              const file = path.resolve('MILFT_Tournois_V1_1_VALIDATION_HEBERGEMENT_STABLE_2026-11-02.html');
              await page.goto(pathToFileURL(file).href, { waitUntil: 'load' });
              await page.waitForTimeout(1200);
              const text = await page.locator('body').innerText();
              if (text.trim().length < 100) throw new Error('Interface vide ou non chargee');
              if (errors.length) throw new Error('Erreurs JS : ' + errors.join(' | '));
              console.log('OK : application chargee dans Chromium mobile, sans erreur JS.');
              await page.screenshot({ path: 'milft-smoke.png', fullPage: true });
            } finally { await browser.close(); }
          })().catch(e => { console.error(e); process.exit(1); });
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-milft-chromium
          path: milft-smoke.png

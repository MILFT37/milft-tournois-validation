name: Chromium mobile - fumee V1.1
on:
  push:
    branches: [main]
    paths:
      - 'MILFT_Tournois_V1_1_VALIDATION_HEBERGEMENT_STABLE_2026-11-02.html'
      - '.github/workflows/chromium-mobile-v11.yml'
  workflow_dispatch:
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Chromium et Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Vérifier la syntaxe de tous les scripts intégrés
        run: |
          node <<'JS'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const assert=require('node:assert/strict');
          const html=fs.readFileSync('MILFT_Tournois_V1_1_VALIDATION_HEBERGEMENT_STABLE_2026-11-02.html','utf8');
          const scripts=[...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(([,attrs,body])=>!/(?:^|\s)src\s*=/.test(attrs)&&body.trim());
          assert.ok(scripts.length>0,'au moins un script intégré');
          scripts.forEach(([,attrs,body],index)=>{
            try{new vm.Script(body,{filename:'script-inline-'+(index+1)+'.js'});}
            catch(e){throw new Error('Script '+(index+1)+' invalide : '+e.message);}
          });
          console.log(scripts.length+' scripts intégrés : syntaxe valide');
          JS
      - name: Test réel en navigateur mobile
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          (async () => {
            const browser = await chromium.launch({headless:true});
            try {
              const page = await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              const errors = [];
              page.on('pageerror', error => errors.push(error.message));
              const file = 'MILFT_Tournois_V1_1_VALIDATION_HEBERGEMENT_STABLE_2026-11-02.html';
              await page.goto('file://' + process.cwd() + '/' + file, {waitUntil:'load'});
              await page.waitForTimeout(1200);
              assert.match(await page.title(),/MILFT Tournois/);
              const result = await page.evaluate(() => ({
                width: document.documentElement.scrollWidth,
                viewport: window.innerWidth,
                capGrid: (() => { const el=document.createElement('div');el.className='cap-command-row';document.body.appendChild(el);const display=getComputedStyle(el).display;el.remove();return display; })(),
                hasCap: typeof window.capAutoAssign === 'function' && typeof window.capCompClose === 'function',
                hasAnnual: typeof window.renderAfterPresenceChange === 'function',
                hasBody: document.body.innerText.length > 100
              }));
              assert.equal(result.hasBody,true,'interface visible');
              assert.equal(result.capGrid,'grid','commandes CAP en grille sur mobile');
              assert.equal(result.hasCap,true,'fonctions CAP disponibles');
              assert.equal(result.hasAnnual,true,'fonction repli présences disponible');
              // Lot responsive : vérification sur trois tailles d'écran.
              for (const width of [360,390,768]) {
                await page.setViewportSize({width,height:844});
                const css = await page.evaluate(() => {
                  const el=document.createElement('div');
                  el.className='cap-command-row';
                  document.body.appendChild(el);
                  const style=getComputedStyle(el);
                  const result={display:style.display,columns:style.gridTemplateColumns};
                  el.remove();
                  return result;
                });
                assert.equal(css.display,'grid','grille CAP à '+width+'px');
                assert.equal(css.columns.trim().split(/\s+/).length,2,'deux colonnes CAP à '+width+'px');
                console.log('RESPONSIVE OK',width,css);
              }
              // Lot commandes : scénarios sans/sur commande de tour suivant.
              const layouts = await page.evaluate(() => {
                const cases = [
                  ['complet',['cap-next-round','cap-assign-command','cap-finish-command','cap-abandon-command']],
                  ['sans-tour-suivant',['cap-assign-command','cap-finish-command','cap-abandon-command']],
                  ['termine',['cap-assign-command','cap-finish-command']]
                ];
                return cases.map(([name,classes]) => {
                  const row=document.createElement('div');
                  row.className='row cap-command-row';
                  for(const cls of classes) {
                    const button=document.createElement('button');
                    button.className=cls;
                    button.textContent=cls;
                    row.appendChild(button);
                  }
                  document.body.appendChild(row);
                  const result={name,buttons:[...row.children].map(b=>{
                    const style=getComputedStyle(b);
                    const rect=b.getBoundingClientRect();
                    return {name:b.className,column:style.gridColumnStart,width:rect.width,height:rect.height};
                  })};
                  row.remove();
                  return result;
                });
              });
              for(const layout of layouts){
                assert.ok(layout.buttons.every(b=>b.height>=44),'cible tactile 44px : '+layout.name);
                assert.ok(layout.buttons.every(b=>b.width>0),'boutons visibles : '+layout.name);
                if(layout.name==='sans-tour-suivant'){
                  assert.equal(layout.buttons[0].column,'1','attribution commence colonne 1');
                }
                if(layout.name==='termine'){
                  assert.equal(layout.buttons[1].column,'1','terminer commence colonne 1');
                }
                console.log('COMMANDES OK',layout.name,layout.buttons);
              }
              // Vérification des placements réels (pas seulement des classes CSS).
              const positions = await page.evaluate(() => {
                const row=document.createElement('div');
                row.className='row cap-command-row';
                row.style.width='340px';
                for(const cls of ['cap-next-round','cap-assign-command','cap-finish-command','cap-abandon-command']){
                  const button=document.createElement('button');
                  button.className=cls;
                  button.textContent=cls;
                  row.appendChild(button);
                }
                document.body.appendChild(row);
                const result=[...row.children].map(el=>{
                  const box=el.getBoundingClientRect();
                  return {name:el.className,x:box.x,y:box.y,w:box.width,h:box.height};
                });
                row.remove();
                return result;
              });
              assert.ok(Math.abs(positions[0].y-positions[1].y)<2,'première ligne côte à côte');
              assert.ok(Math.abs(positions[2].y-positions[3].y)<2,'seconde ligne côte à côte');
              assert.ok(positions[2].y>positions[0].y,'Terminer sur seconde ligne');
              assert.ok(positions[3].x>positions[2].x,'Abandonner à droite');
              console.log('PLACEMENTS CAP OK',positions);
              // Fonctionnel CAP : attribution automatique, tables exclues et absence de doublon.
              const assignment = await page.evaluate(() => {
                const oldDb=db,oldSave=save,oldFlash=flash;
                try {
                  save=()=>{};flash=()=>{};
                  const t={
                    id:'ci-cap',closed:false,
                    tables:[{id:1,state:'free'},{id:2,state:'excluded'},{id:3,state:'free'}],
                    cap:{competition:true,phase:'groups',matches:[
                      {id:'ci-m1',phase:'groups',status:'waiting',a:'a',b:'b',tableId:null},
                      {id:'ci-m2',phase:'groups',status:'waiting',a:'c',b:'d',tableId:null},
                      {id:'ci-m3',phase:'groups',status:'waiting',a:'a',b:'f',tableId:null}
                    ]}
                  };
                  db={players:[],tournaments:[t],selected:t.id};
                  capAutoAssign();
                  const first=t.cap.matches.map(m=>m.tableId);
                  capAutoAssign();
                  const second=t.cap.matches.map(m=>m.tableId);
                  return {first,second};
                } finally {db=oldDb;save=oldSave;flash=oldFlash;}
              });
              assert.deepEqual(assignment.first,[1,3,null],'attribue uniquement les tables libres');
              assert.deepEqual(assignment.second,[1,3,null],'ne réattribue pas les tables occupées');
              assert.equal(assignment.first[2],null,'équipe déjà engagée sur une autre table');
              console.log('ATTRIBUTION CAP FONCTIONNELLE OK',assignment);
              // Une rencontre déjà en cours réserve ses équipes même sans table renseignée.
              const playingGuard=await page.evaluate(()=>{
                const oldDb=db,oldSave=save,oldFlash=flash;
                try {
                  save=()=>{};flash=()=>{};
                  const t={id:'ci-playing',closed:false,
                    tables:[{id:1,state:'free'},{id:2,state:'free'}],
                    cap:{competition:true,phase:'groups',matches:[
                      {id:'ci-running',phase:'groups',status:'playing',a:'a',b:'b',tableId:null},
                      {id:'ci-conflict',phase:'groups',status:'waiting',a:'a',b:'c',tableId:null},
                      {id:'ci-available',phase:'groups',status:'waiting',a:'d',b:'e',tableId:null}
                    ]}};
                  db={players:[],tournaments:[t],selected:t.id};
                  capAutoAssign();
                  return t.cap.matches.map(m=>m.tableId);
                } finally {db=oldDb;save=oldSave;flash=oldFlash;}
              });
              assert.deepEqual(playingGuard,[null,null,1],'équipe du match en cours réservée sans table');
              console.log('ÉQUIPES EN COURS PROTÉGÉES',playingGuard);
              // Attribution manuelle : empêcher une équipe de jouer sur deux tables.
              const manualGuard = await page.evaluate(() => {
                const oldDb=db,oldSave=save,oldFlash=flash,oldAlert=window.alert;
                const messages=[];
                const select=document.createElement('select');
                select.id='cap-table-ci-manual';
                select.innerHTML='<option value="2" selected>Table 2</option>';
                document.body.appendChild(select);
                try {
                  save=()=>{};flash=()=>{};window.alert=msg=>messages.push(msg);
                  const t={id:'ci-manual',closed:false,
                    tables:[{id:1,state:'free'},{id:2,state:'free'}],
                    cap:{competition:true,phase:'groups',matches:[
                      {id:'ci-running',phase:'groups',status:'playing',a:'a',b:'b',tableId:1},
                      {id:'ci-manual',phase:'groups',status:'waiting',a:'a',b:'c',tableId:null}
                    ]}};
                  db={players:[],tournaments:[t],selected:t.id};
                  capAssignTable('ci-manual');
                  return {tableId:t.cap.matches[1].tableId,messages};
                } finally {
                  select.remove();db=oldDb;save=oldSave;flash=oldFlash;window.alert=oldAlert;
                }
              });
              assert.equal(manualGuard.tableId,null,'attribution manuelle refusée si équipe occupée');
              assert.ok(manualGuard.messages.some(m=>m.includes('joue déjà')),'alerte conflit équipe');
              console.log('PROTECTION ATTRIBUTION MANUELLE OK',manualGuard);
              // Chemin positif : attribution manuelle autorisée puis réaffectation en attente.
              const manualSuccess=await page.evaluate(()=>{
                const oldDb=db,oldSave=save,oldFlash=flash,oldAlert=window.alert;
                const select=document.createElement('select');
                select.id='cap-table-ci-ok';
                select.innerHTML='<option value="2" selected>Table 2</option><option value="3">Table 3</option>';
                document.body.appendChild(select);
                const messages=[];
                try {
                  save=()=>{};flash=()=>{};window.alert=msg=>messages.push(msg);
                  const match={id:'ci-ok',phase:'groups',status:'waiting',a:'c',b:'d',tableId:null};
                  const t={id:'ci-ok',closed:false,tables:[{id:1,state:'free'},{id:2,state:'free'},{id:3,state:'free'}],
                    cap:{competition:true,phase:'groups',matches:[
                      {id:'ci-other',phase:'groups',status:'playing',a:'a',b:'b',tableId:1},match
                    ]}};
                  db={players:[],tournaments:[t],selected:t.id};
                  capAssignTable('ci-ok');
                  const assigned=match.tableId;
                  select.value='3';
                  capAssignTable('ci-ok');
                  return {assigned,moved:match.tableId,messages};
                } finally {select.remove();db=oldDb;save=oldSave;flash=oldFlash;window.alert=oldAlert;}
              });
              assert.equal(manualSuccess.assigned,2,'attribution manuelle sur table libre');
              assert.equal(manualSuccess.moved,3,'réaffectation autorisée avant début du match');
              assert.deepEqual(manualSuccess.messages,[],'aucune alerte pour attribution valide');
              console.log('ATTRIBUTION MANUELLE VALIDE OK',manualSuccess);
              // Menus CAP : seules les tables disponibles doivent être proposées.
              const optionsGuard=await page.evaluate(()=>{
                const t={
                  closed:false,
                  tables:[{id:1,state:'free'},{id:2,state:'free'},{id:3,state:'excluded'}],
                  cap:{competition:true,phase:'groups',structure:'league',matches:[
                    {id:'ci-used',phase:'groups',status:'playing',a:'a',b:'b',tableId:1},
                    {id:'ci-free',phase:'groups',status:'waiting',a:'c',b:'d',tableId:null}
                  ]}
                };
                const available=t.tables.filter(x=>x.id===t.cap.matches[1].tableId||capFreeTable(t,x.id,t.cap.matches[1].id)).map(x=>x.id);
                const current=t.tables.filter(x=>x.id===t.cap.matches[0].tableId||capFreeTable(t,x.id,t.cap.matches[0].id)).map(x=>x.id);
                return {available,current};
              });
              assert.deepEqual(optionsGuard.available,[2],'table occupée ou exclue masquée');
              assert.deepEqual(optionsGuard.current,[1,2],'table actuellement attribuée conservée');
              console.log('FILTRAGE TABLES CAP OK',optionsGuard);
              // Une rencontre en cours ne peut pas libérer sa table par erreur.
              const releaseGuard=await page.evaluate(()=>{
                const oldDb=db,oldSave=save,oldFlash=flash,oldAlert=window.alert;
                const select=document.createElement('select');
                select.id='cap-table-ci-release';select.innerHTML='<option value="" selected>Sans table</option>';
                document.body.appendChild(select);
                const messages=[];
                try {
                  save=()=>{};flash=()=>{};window.alert=msg=>messages.push(msg);
                  const match={id:'ci-release',status:'playing',phase:'groups',a:'a',b:'b',tableId:1};
                  const t={id:'ci-release',closed:false,tables:[{id:1,state:'free'}],cap:{competition:true,phase:'groups',matches:[match]}};
                  db={players:[],tournaments:[t],selected:t.id};
                  capAssignTable('ci-release');
                  return {tableId:match.tableId,messages};
                } finally {select.remove();db=oldDb;save=oldSave;flash=oldFlash;window.alert=oldAlert;}
              });
              assert.equal(releaseGuard.tableId,1,'table d’un match en cours conservée');
              assert.ok(releaseGuard.messages.some(m=>m.includes('en cours')),'avertissement explicatif');
              console.log('PROTECTION LIBÉRATION TABLE OK',releaseGuard);
              // Une rencontre en cours ne doit pas changer de table par erreur.
              const moveGuard=await page.evaluate(()=>{
                const oldDb=db,oldSave=save,oldFlash=flash,oldAlert=window.alert;
                const select=document.createElement('select');
                select.id='cap-table-ci-move';select.innerHTML='<option value="2" selected>Table 2</option>';
                document.body.appendChild(select);
                const messages=[];
                try {
                  save=()=>{};flash=()=>{};window.alert=msg=>messages.push(msg);
                  const match={id:'ci-move',status:'playing',phase:'groups',a:'a',b:'b',tableId:1};
                  const t={id:'ci-move',closed:false,tables:[{id:1,state:'free'},{id:2,state:'free'}],cap:{competition:true,phase:'groups',matches:[match]}};
                  db={players:[],tournaments:[t],selected:t.id};
                  capAssignTable('ci-move');
                  return {tableId:match.tableId,messages};
                } finally {select.remove();db=oldDb;save=oldSave;flash=oldFlash;window.alert=oldAlert;}
              });
              assert.equal(moveGuard.tableId,1,'table initiale conservée');
              assert.ok(moveGuard.messages.some(m=>m.includes('en cours')),'alerte changement de table');
              console.log('PROTECTION DÉPLACEMENT TABLE OK',moveGuard);
              // Gestion des tables : impossible d'exclure ou retirer une table occupée.
              const tableGuards=await page.evaluate(()=>{
                const oldDb=db,oldSave=save,oldFlash=flash,oldAlert=window.alert,oldConfirm=window.confirm;
                const messages=[];
                const state=document.createElement('select');
                state.id='cap-table-state-2';state.innerHTML='<option value="excluded" selected>Exclue</option>';
                const count=document.createElement('input');
                count.id='cap-table-count';count.value='1';
                document.body.append(state,count);
                try {
                  save=()=>{};flash=()=>{};window.alert=m=>messages.push(m);window.confirm=()=>true;
                  const t={id:'ci-table-guard',closed:false,tables:[{id:1,state:'free'},{id:2,state:'free'}],
                    cap:{competition:true,phase:'groups',matches:[
                      {id:'ci-running',phase:'groups',status:'playing',a:'a',b:'b',tableId:2}
                    ]}};
                  db={players:[],tournaments:[t],selected:t.id};
                  capSetTable(2);
                  const stateAfter=t.tables[1].state;
                  capSetTableCount();
                  return {stateAfter,countAfter:t.tables.length,messages};
                } finally {
                  state.remove();count.remove();db=oldDb;save=oldSave;flash=oldFlash;
                  window.alert=oldAlert;window.confirm=oldConfirm;
                }
              });
              assert.equal(tableGuards.stateAfter,'free','table occupée non exclue');
              assert.equal(tableGuards.countAfter,2,'table occupée non supprimée');
              assert.equal(tableGuards.messages.length,2,'deux refus explicites');
              console.log('GESTION DES TABLES OCCUPÉES OK',tableGuards);
              // Clôture CAP : refuser toute rencontre inachevée.
              const closeGuard = await page.evaluate(() => {
                const oldDb=db,oldSave=save,oldFlash=flash,oldAlert=window.alert;
                const messages=[];
                try {
                  save=()=>{};flash=()=>{};window.alert=msg=>messages.push(msg);
                  const t={id:'ci-close',name:'CI clôture',closed:false,
                    cap:{competition:true,phase:'groups',bracket:false,matches:[
                      {id:'ci-pending',phase:'groups',status:'waiting'}
                    ]}};
                  db={players:[],tournaments:[t],selected:t.id};
                  capCompClose();
                  return {closed:t.closed,messages};
                } finally {
                  db=oldDb;save=oldSave;flash=oldFlash;window.alert=oldAlert;
                }
              });
              assert.equal(closeGuard.closed,false,'clôture refusée si rencontre en attente');
              assert.ok(closeGuard.messages.some(m=>m.includes('non terminées')),'message explicatif');
              console.log('PROTECTION CLÔTURE CAP OK',closeGuard);
              // Saisie CAP : rejeter les scores non atteints et valider un relais réglementaire.
              const scoreChecks=await page.evaluate(()=>{
                const oldDb=db,oldSave=save,oldFlash=flash,oldAlert=window.alert;
                const a=document.createElement('input'),b=document.createElement('input');
                a.id='capca-ci-score';b.id='capcb-ci-score';
                document.body.append(a,b);
                const messages=[];
                try {
                  save=()=>{};flash=()=>{};window.alert=m=>messages.push(m);
                  const match={id:'ci-score',phase:'groups',status:'waiting',relays:[],a:'a',b:'b',tableId:null};
                  const t={id:'ci-score',closed:false,cap:{competition:true,phase:'groups',targets:[5,10],finish:'winner',matches:[match]}};
                  db={players:[],tournaments:[t],selected:t.id};
                  a.value='4';b.value='3';capCompRecord('ci-score');
                  const rejected=match.relays.length;
                  a.value='5';b.value='3';capCompRecord('ci-score');
                  const accepted=match.relays.map(x=>({...x}));
                  a.value='4';b.value='10';capCompRecord('ci-score');
                  const afterRegression=match.relays.length;
                  return {rejected,accepted,afterRegression,messages};
                } finally {a.remove();b.remove();db=oldDb;save=oldSave;flash=oldFlash;window.alert=oldAlert;}
              });
              assert.equal(scoreChecks.rejected,0,'palier non atteint refusé');
              assert.deepEqual(scoreChecks.accepted,[{a:5,b:3}],'relais valide enregistré');
              assert.equal(scoreChecks.afterRegression,1,'score cumulé décroissant refusé');
              assert.equal(scoreChecks.messages.length,2,'deux alertes de score invalide');
              console.log('SAISIE RELAIS CAP OK',scoreChecks);
              // Saisie CAP : un dernier relais valide clôture la rencontre.
              const finalRelay=await page.evaluate(()=>{
                const oldDb=db,oldSave=save,oldFlash=flash,oldAlert=window.alert;
                const a=document.createElement('input'),b=document.createElement('input');
                a.id='capca-ci-final';b.id='capcb-ci-final';
                document.body.append(a,b);
                const messages=[];
                try {
                  save=()=>{};flash=()=>{};window.alert=m=>messages.push(m);
                  const match={id:'ci-final',phase:'groups',status:'playing',relays:[{a:5,b:3}],a:'a',b:'b',tableId:1};
                  const t={id:'ci-final',closed:false,cap:{competition:true,phase:'groups',targets:[5,10],finish:'winner',matches:[match]}};
                  db={players:[],tournaments:[t],selected:t.id};
                  a.value='10';b.value='7';capCompRecord('ci-final');
                  return {status:match.status,relays:match.relays.map(x=>({...x})),messages};
                } finally {a.remove();b.remove();db=oldDb;save=oldSave;flash=oldFlash;window.alert=oldAlert;}
              });
              assert.equal(finalRelay.status,'done','rencontre terminée après dernier relais');
              assert.deepEqual(finalRelay.relays,[{a:5,b:3},{a:10,b:7}],'score cumulé final correct');
              assert.deepEqual(finalRelay.messages,[],'aucune alerte pour un relais final valide');
              console.log('DERNIER RELAIS CAP OK',finalRelay);
              // Fin de rencontre CAP : la table est automatiquement libérée.
              const releaseAfterScore=await page.evaluate(()=>{
                const oldDb=db,oldSave=save,oldFlash=flash,oldAlert=window.alert;
                const a=document.createElement('input'),b=document.createElement('input');
                a.id='capca-ci-release-score';b.id='capcb-ci-release-score';
                document.body.append(a,b);
                const messages=[];
                try {
                  save=()=>{};flash=()=>{};window.alert=m=>messages.push(m);
                  const match={id:'ci-release-score',phase:'groups',status:'playing',relays:[{a:5,b:3}],a:'a',b:'b',tableId:1};
                  const t={id:'ci-release-score',closed:false,tables:[{id:1,state:'free'}],cap:{competition:true,phase:'groups',targets:[5,10],finish:'winner',matches:[match]}};
                  db={players:[],tournaments:[t],selected:t.id};
                  a.value='10';b.value='7';capCompRecord(match.id);
                  return {status:match.status,tableId:match.tableId,available:capFreeTable(t,1),messages};
                } finally {a.remove();b.remove();db=oldDb;save=oldSave;flash=oldFlash;window.alert=oldAlert;}
              });
              assert.equal(releaseAfterScore.status,'done','match terminé');
              assert.equal(releaseAfterScore.tableId,null,'table libérée après dernier relais');
              assert.equal(releaseAfterScore.available,true,'table à nouveau disponible');
              assert.deepEqual(releaseAfterScore.messages,[],'aucune alerte');
              console.log('LIBÉRATION TABLE APRÈS SCORE OK',releaseAfterScore);
              // Correction de relais : une rencontre avec table reste en cours.
              const undoCheck=await page.evaluate(()=>{
                const oldDb=db,oldSave=save,oldFlash=flash,oldConfirm=window.confirm;
                try {
                  save=()=>{};flash=()=>{};window.confirm=()=>true;
                  const match={id:'ci-undo',phase:'groups',status:'done',relays:[{a:5,b:3},{a:10,b:7}],a:'a',b:'b',tableId:1};
                  const t={id:'ci-undo',closed:false,cap:{competition:true,phase:'groups',matches:[match]}};
                  db={players:[],tournaments:[t],selected:t.id};
                  capCompUndo('ci-undo');
                  return {status:match.status,relays:match.relays.map(x=>({...x})),tableId:match.tableId};
                } finally {db=oldDb;save=oldSave;flash=oldFlash;window.confirm=oldConfirm;}
              });
              assert.equal(undoCheck.status,'playing','match avec table reprend en cours');
              assert.deepEqual(undoCheck.relays,[{a:5,b:3}],'seul le dernier relais retiré');
              assert.equal(undoCheck.tableId,1,'table conservée');
              console.log('CORRECTION RELAIS CAP OK',undoCheck);
              // Correction des scores : sans table, reprise en attente ; tableau déjà créé, correction interdite.
              const undoEdges=await page.evaluate(()=>{
                const oldDb=db,oldSave=save,oldFlash=flash,oldConfirm=window.confirm,oldAlert=window.alert;
                const alerts=[];
                try {
                  save=()=>{};flash=()=>{};window.confirm=()=>true;window.alert=m=>alerts.push(m);
                  const match={id:'ci-undo-edge',phase:'groups',status:'done',relays:[{a:5,b:3}],tableId:null};
                  const t={id:'ci-undo-edge',closed:false,cap:{competition:true,phase:'groups',matches:[match]}};
                  db={players:[],tournaments:[t],selected:t.id};
                  capCompUndo(match.id);
                  const waiting={status:match.status,count:match.relays.length};
                  match.status='done';match.relays=[{a:5,b:3}];
                  t.cap.matches.push({id:'ci-bracket',phase:'bracket',round:1,status:'waiting'});
                  capCompUndo(match.id);
                  return {waiting,blocked:{status:match.status,count:match.relays.length},alerts};
                } finally {db=oldDb;save=oldSave;flash=oldFlash;window.confirm=oldConfirm;window.alert=oldAlert;}
              });
              assert.deepEqual(undoEdges.waiting,{status:'waiting',count:0},'sans table : reprise en attente');
              assert.deepEqual(undoEdges.blocked,{status:'done',count:1},'poules figées après tableau');
              assert.ok(undoEdges.alerts.some(m=>m.includes('tableau final')||m.includes('phase actuelle')),'message blocage après tableau');
              console.log('CORRECTION RELAIS CAS LIMITES OK',undoEdges);
              // Verrouillage de saisie après progression du tableau.
              const lockedRelay=await page.evaluate(()=>{
                const oldDb=db,oldSave=save,oldFlash=flash,oldAlert=window.alert;
                const a=document.createElement('input'),b=document.createElement('input');
                a.id='capca-ci-lock';b.id='capcb-ci-lock';document.body.append(a,b);
                const messages=[];
                try {
                  save=()=>{};flash=()=>{};window.alert=m=>messages.push(m);
                  const match={id:'ci-lock',phase:'groups',status:'waiting',relays:[],a:'a',b:'b'};
                  const t={id:'ci-lock',closed:false,cap:{competition:true,phase:'bracket',targets:[5],finish:'winner',matches:[match,{id:'ci-next',phase:'bracket',round:1,status:'waiting'}]}};
                  db={players:[],tournaments:[t],selected:t.id};
                  a.value='5';b.value='3';capCompRecord(match.id);
                  return {relays:match.relays.length,messages};
                } finally {a.remove();b.remove();db=oldDb;save=oldSave;flash=oldFlash;window.alert=oldAlert;}
              });
              assert.equal(lockedRelay.relays,0,'saisie des poules bloquée après tableau');
              assert.ok(lockedRelay.messages.some(m=>m.includes('phase actuelle')),'alerte de verrouillage de phase');
              console.log('VERROUILLAGE SAISIE CAP OK',lockedRelay);
              // Aucun relais supplémentaire après le dernier palier ou sur match abandonné.
              const relayGuards=await page.evaluate(()=>{
                const oldDb=db,oldSave=save,oldFlash=flash,oldAlert=window.alert;
                const a=document.createElement('input'),b=document.createElement('input');
                a.id='capca-ci-guard';b.id='capcb-ci-guard';document.body.append(a,b);
                const messages=[];
                try {
                  save=()=>{};flash=()=>{};window.alert=m=>messages.push(m);
                  const match={id:'ci-guard',phase:'groups',status:'waiting',relays:[{a:5,b:3}],a:'a',b:'b'};
                  const t={id:'ci-guard',closed:false,cap:{competition:true,phase:'groups',targets:[5],finish:'winner',matches:[match]}};
                  db={players:[],tournaments:[t],selected:t.id};
                  a.value='5';b.value='3';capCompRecord(match.id);
                  const extra=match.relays.length;
                  match.status='abandoned';capCompRecord(match.id);
                  const abandoned=match.relays.length;
                  return {extra,abandoned,messages};
                } finally {a.remove();b.remove();db=oldDb;save=oldSave;flash=oldFlash;window.alert=oldAlert;}
              });
              assert.equal(relayGuards.extra,1,'aucun relais au-delà du palier final');
              assert.equal(relayGuards.abandoned,1,'aucun relais sur rencontre abandonnée');
              assert.ok(relayGuards.messages.some(m=>m.includes('Aucun relais supplémentaire')),'alerte explicite');
              console.log('GARDE-FOUS RELAIS CAP OK',relayGuards);
              // Une rencontre abandonnée ne doit pas être réactivée par l'annulation d'un relais.
              const abandonedUndo=await page.evaluate(()=>{
                const oldDb=db,oldSave=save,oldFlash=flash,oldConfirm=window.confirm;
                let confirmations=0;
                try {
                  save=()=>{};flash=()=>{};window.confirm=()=>{confirmations++;return true};
                  const match={id:'ci-abandoned-undo',phase:'groups',status:'abandoned',relays:[{a:5,b:3}],tableId:null};
                  const t={id:'ci-abandoned-undo',closed:false,cap:{competition:true,phase:'groups',matches:[match]}};
                  db={players:[],tournaments:[t],selected:t.id};
                  capCompUndo(match.id);
                  return {status:match.status,relays:match.relays.length,confirmations};
                } finally {db=oldDb;save=oldSave;flash=oldFlash;window.confirm=oldConfirm;}
              });
              assert.deepEqual(abandonedUndo,{status:'abandoned',relays:1,confirmations:0},'correction interdite sur match abandonné');
              console.log('MATCH ABANDONNÉ PROTÉGÉ OK',abandonedUndo);
              // Objectifs de relais : un palier ne peut pas reculer.
              const targetGuards=await page.evaluate(()=>{
                const oldDb=db,oldSave=save,oldFlash=flash,oldAlert=window.alert;
                const a=document.createElement('input'),b=document.createElement('input');
                a.id='capca-ci-target';b.id='capcb-ci-target';document.body.append(a,b);
                const messages=[];
                try {
                  save=()=>{};flash=()=>{};window.alert=m=>messages.push(m);
                  const match={id:'ci-target',phase:'groups',status:'waiting',relays:[{a:5,b:3}],a:'a',b:'b'};
                  const t={id:'ci-target',closed:false,cap:{competition:true,phase:'groups',targets:[5,5],finish:'winner',matches:[match]}};
                  db={players:[],tournaments:[t],selected:t.id};
                  a.value='5';b.value='4';capCompRecord(match.id);
                  return {count:match.relays.length,messages};
                } finally {a.remove();b.remove();db=oldDb;save=oldSave;flash=oldFlash;window.alert=oldAlert;}
              });
              assert.equal(targetGuards.count,1,'palier non croissant rejeté');
              assert.ok(targetGuards.messages.some(m=>m.includes('strictement croissants')),'alerte explicite sur palier');
              console.log('OBJECTIFS RELAIS CAP OK',targetGuards);
              // Rendu des commandes CAP selon les états et les phases verrouillées.
              const capRenderStates=await page.evaluate(()=>{
                const c={phase:'groups',targets:[5,10],types:['S','D'],clubs:[{id:'a',name:'A'},{id:'b',name:'B'}],matches:[]};
                const t={closed:false,cap:c};
                const make=(status,relays=[],bye=false)=>({id:'ci-render',a:'a',b:'b',phase:'groups',status,relays,bye});
                const render=m=>{c.matches=[m];return capCompMatch(t,m)};
                const waiting=render(make('waiting'));
                const playing=render(make('playing',[{a:5,b:3}]));
                const abandoned=render(make('abandoned',[{a:5,b:3}]));
                const bye=render(make('done',[],true));
                const done=render(make('done',[{a:5,b:3},{a:10,b:7}]));
                c.matches.push({id:'next-phase',phase:'bracket',round:1,status:'waiting'});
                const locked=capCompMatch(t,c.matches[0]);
                return {
                  waitingInput:waiting.includes('Enregistrer le relais'),
                  playingInput:playing.includes('Enregistrer le relais'),
                  abandonedInput:abandoned.includes('Enregistrer le relais'),
                  abandonedLabel:abandoned.includes('Abandonné'),
                  byeInput:bye.includes('Enregistrer le relais'),
                  doneInput:done.includes('Enregistrer le relais'),
                  doneCorrection:done.includes('Corriger dernier relais'),
                  lockedCorrection:locked.includes('Corriger dernier relais')
                };
              });
              assert.deepEqual(capRenderStates,{
                waitingInput:true,playingInput:true,abandonedInput:false,abandonedLabel:true,
                byeInput:false,doneInput:false,doneCorrection:true,lockedCorrection:false
              },'états de saisie et correction CAP');
              console.log('AFFICHAGE DES COMMANDES CAP OK',capRenderStates);
              // Progression CAP : bouton désactivé tant que la phase est incomplète.
              const nextButton=await page.evaluate(()=>{
                const c={competition:true,structure:'cup',phase:'groups',bracket:true,round:1,targets:[5],types:['S'],clubs:[{id:'a',name:'A'},{id:'b',name:'B'}],pools:[['a','b']],matches:[]};
                const t={closed:false,cap:c,tables:[{id:1,state:'free'}]};
                const m={id:'ci-next-button',a:'a',b:'b',phase:'groups',status:'waiting',relays:[],tableId:null};
                c.matches=[m];
                const waiting=capCompLive(t).includes('onclick="capCompNext()" disabled');
                m.status='done';m.relays=[{a:5,b:3}];
                const completed=capCompLive(t).includes('onclick="capCompNext()" ');
                const completedDisabled=capCompLive(t).includes('onclick="capCompNext()" disabled');
                return {waiting,completed,completedDisabled};
              });
              assert.equal(nextButton.waiting,true,'progression désactivée si rencontre en attente');
              assert.equal(nextButton.completed,true,'bouton progression visible une fois terminée');
              assert.equal(nextButton.completedDisabled,false,'progression activée si résultats complets');
              console.log('PROGRESSION CAP CONDITIONNELLE OK',nextButton);
              // BYE : seul un club identifié face à une place vide peut en bénéficier.
              const byeGuard=await page.evaluate(()=>{
                const oldDb=db,oldSave=save,oldFlash=flash,oldConfirm=window.confirm,oldAlert=window.alert;
                const messages=[];
                try {
                  save=()=>{};flash=()=>{};window.confirm=()=>true;window.alert=m=>messages.push(m);
                  const match={id:'ci-bye-guard',phase:'bracket',round:1,a:null,b:null,bye:false,status:'waiting',relays:[]};
                  const t={id:'ci-bye-guard',closed:false,cap:{competition:true,phase:'bracket',round:1,matches:[match],byeWin:5,byeLose:3}};
                  db={players:[],tournaments:[t],selected:t.id};
                  capCompBye(match.id);
                  const rejected={bye:match.bye,status:match.status};
                  match.a='a';capCompBye(match.id);
                  return {rejected,accepted:{bye:match.bye,status:match.status,score:match.score},messages};
                } finally {db=oldDb;save=oldSave;flash=oldFlash;window.confirm=oldConfirm;window.alert=oldAlert;}
              });
              assert.deepEqual(byeGuard.rejected,{bye:false,status:'waiting'},'BYE interdit sans bénéficiaire');
              assert.deepEqual(byeGuard.accepted,{bye:true,status:'done',score:{a:5,b:3}},'BYE valide enregistré');
              assert.ok(byeGuard.messages.length>=1,'erreur explicite pour BYE invalide');
              console.log('BYE AVEC BÉNÉFICIAIRE OK',byeGuard);
              // Saisie CAP : le tour précédent est définitivement protégé.
              const previousRound=await page.evaluate(()=>{
                const oldDb=db,oldSave=save,oldFlash=flash,oldAlert=window.alert;
                const a=document.createElement('input'),b=document.createElement('input');
                a.id='capca-ci-old-round';b.id='capcb-ci-old-round';document.body.append(a,b);
                const messages=[];
                try {
                  save=()=>{};flash=()=>{};window.alert=m=>messages.push(m);
                  const match={id:'ci-old-round',phase:'bracket',round:1,status:'waiting',relays:[],a:'a',b:'b'};
                  const t={id:'ci-old-round',closed:false,cap:{competition:true,phase:'bracket',round:2,targets:[5],finish:'winner',matches:[match]}};
                  db={players:[],tournaments:[t],selected:t.id};
                  a.value='5';b.value='3';capCompRecord(match.id);
                  return {count:match.relays.length,messages};
                } finally {a.remove();b.remove();db=oldDb;save=oldSave;flash=oldFlash;window.alert=oldAlert;}
              });
              assert.equal(previousRound.count,0,'aucun relais dans un tour précédent');
              assert.ok(previousRound.messages.some(m=>m.includes('phase actuelle')),'alerte tour inactif');
              console.log('TOUR PRÉCÉDENT CAP PROTÉGÉ OK',previousRound);
              // Persistance réelle : stockage navigateur et rechargement.
              await page.evaluate(() => localStorage.setItem('milft-ci-persistence','verification'));
              await page.reload({waitUntil:'load'});
              assert.equal(await page.evaluate(() => localStorage.getItem('milft-ci-persistence')),'verification','localStorage conserve au rechargement');
              await page.evaluate(() => localStorage.removeItem('milft-ci-persistence'));
              assert.match(await page.title(),/MILFT Tournois/,'application encore chargée après reload');
              // Sauvegarde applicative : tester le cycle complet avec une base vide valide.
              const saved = await page.evaluate(() => {
                const previous=localStorage.getItem(KEY);
                db=initial();
                db.players=[{id:'ci-joueur',first:'Test',last:'Sauvegarde'}];
                save();
                return {key:KEY,previous};
              });
              try {
                await page.reload({waitUntil:'load'});
                const restored=await page.evaluate(() => ({
                  players:db.players.map(p=>({id:p.id,first:p.first,last:p.last})),
                  tournaments:db.tournaments.length,
                  selected:db.selected
                }));
                assert.deepEqual(restored.players,[{id:'ci-joueur',first:'Test',last:'Sauvegarde'}],'joueur restauré depuis le stockage après rechargement');
                assert.equal(restored.tournaments,0,'base de test sans tournoi');
                assert.equal(restored.selected,null,'aucune sélection parasite');
                console.log('SAUVEGARDE ET RESTAURATION APPLICATIVE OK',restored);
              } finally {
                await page.evaluate(({key,previous}) => {
                  if(previous===null)localStorage.removeItem(key);
                  else localStorage.setItem(key,previous);
                },saved);
                await page.reload({waitUntil:'load'});
              }
              console.log('RECHARGEMENT ET STOCKAGE OK');
              assert.deepEqual(errors,[],'aucune erreur JavaScript au chargement et au rechargement');
              console.log('CHROMIUM MOBILE OK',result);
            } catch (error) {
              const pages=browser.contexts().flatMap(context=>context.pages());
              if(pages.length) {
                await pages[0].screenshot({path:'chromium-echec-mobile.png',fullPage:true}).catch(()=>{});
                const diagnostics=await pages[0].evaluate(()=>({
                  title:document.title,
                  url:location.href,
                  bodyText:document.body?.innerText.slice(0,1200),
                  scrollWidth:document.documentElement.scrollWidth,
                  viewportWidth:innerWidth
                })).catch(e=>({error:String(e)}));
                fs.writeFileSync('chromium-diagnostic.json',JSON.stringify({diagnostics,error:String(error)},null,2));
              }
              throw error;
            } finally { await browser.close(); }
          })().catch(error=>{console.error(error);process.exitCode=1});
          JS
      - name: Conserver captures et diagnostic en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-mobile-diagnostic
          path: |
            chromium-echec-mobile.png
            chromium-diagnostic.json
          if-no-files-found: warn
          retention-days: 7

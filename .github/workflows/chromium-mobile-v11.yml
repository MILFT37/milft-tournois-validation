name: Chromium mobile - fumee V1.1
on:
  push:
    branches: [main]
    paths:
      - 'MILFT_Tournois_V1_1_VALIDATION_HEBERGEMENT_STABLE_2026-11-02.html'
      - '.github/workflows/chromium-mobile-v11.yml'
  workflow_dispatch:
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Chromium et Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test réel en navigateur mobile
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          (async () => {
            const browser = await chromium.launch({headless:true});
            try {
              const page = await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              const errors = [];
              page.on('pageerror', error => errors.push(error.message));
              const file = 'MILFT_Tournois_V1_1_VALIDATION_HEBERGEMENT_STABLE_2026-11-02.html';
              await page.goto('file://' + process.cwd() + '/' + file, {waitUntil:'load'});
              await page.waitForTimeout(1200);
              assert.match(await page.title(),/MILFT Tournois/);
              const result = await page.evaluate(() => ({
                width: document.documentElement.scrollWidth,
                viewport: window.innerWidth,
                capGrid: (() => { const el=document.createElement('div');el.className='cap-command-row';document.body.appendChild(el);const display=getComputedStyle(el).display;el.remove();return display; })(),
                hasCap: typeof window.capAutoAssign === 'function' && typeof window.capCompClose === 'function',
                hasAnnual: typeof window.renderAfterPresenceChange === 'function',
                hasBody: document.body.innerText.length > 100
              }));
              assert.equal(result.hasBody,true,'interface visible');
              assert.equal(result.capGrid,'grid','commandes CAP en grille sur mobile');
              assert.equal(result.hasCap,true,'fonctions CAP disponibles');
              assert.equal(result.hasAnnual,true,'fonction repli présences disponible');
              // Lot responsive : vérification sur trois tailles d'écran.
              for (const width of [360,390,768]) {
                await page.setViewportSize({width,height:844});
                const css = await page.evaluate(() => {
                  const el=document.createElement('div');
                  el.className='cap-command-row';
                  document.body.appendChild(el);
                  const style=getComputedStyle(el);
                  const result={display:style.display,columns:style.gridTemplateColumns};
                  el.remove();
                  return result;
                });
                assert.equal(css.display,'grid','grille CAP à '+width+'px');
                assert.equal(css.columns.trim().split(/\s+/).length,2,'deux colonnes CAP à '+width+'px');
                console.log('RESPONSIVE OK',width,css);
              }
              // Lot commandes : scénarios sans/sur commande de tour suivant.
              const layouts = await page.evaluate(() => {
                const cases = [
                  ['complet',['cap-next-round','cap-assign-command','cap-finish-command','cap-abandon-command']],
                  ['sans-tour-suivant',['cap-assign-command','cap-finish-command','cap-abandon-command']],
                  ['termine',['cap-assign-command','cap-finish-command']]
                ];
                return cases.map(([name,classes]) => {
                  const row=document.createElement('div');
                  row.className='row cap-command-row';
                  for(const cls of classes) {
                    const button=document.createElement('button');
                    button.className=cls;
                    button.textContent=cls;
                    row.appendChild(button);
                  }
                  document.body.appendChild(row);
                  const result={name,buttons:[...row.children].map(b=>{
                    const style=getComputedStyle(b);
                    const rect=b.getBoundingClientRect();
                    return {name:b.className,column:style.gridColumnStart,width:rect.width,height:rect.height};
                  })};
                  row.remove();
                  return result;
                });
              });
              for(const layout of layouts){
                assert.ok(layout.buttons.every(b=>b.height>=44),'cible tactile 44px : '+layout.name);
                assert.ok(layout.buttons.every(b=>b.width>0),'boutons visibles : '+layout.name);
                if(layout.name==='sans-tour-suivant'){
                  assert.equal(layout.buttons[0].column,'1','attribution commence colonne 1');
                }
                if(layout.name==='termine'){
                  assert.equal(layout.buttons[1].column,'1','terminer commence colonne 1');
                }
                console.log('COMMANDES OK',layout.name,layout.buttons);
              }
              // Vérification des placements réels (pas seulement des classes CSS).
              const positions = await page.evaluate(() => {
                const row=document.createElement('div');
                row.className='row cap-command-row';
                row.style.width='340px';
                for(const cls of ['cap-next-round','cap-assign-command','cap-finish-command','cap-abandon-command']){
                  const button=document.createElement('button');
                  button.className=cls;
                  button.textContent=cls;
                  row.appendChild(button);
                }
                document.body.appendChild(row);
                const result=[...row.children].map(el=>{
                  const box=el.getBoundingClientRect();
                  return {name:el.className,x:box.x,y:box.y,w:box.width,h:box.height};
                });
                row.remove();
                return result;
              });
              assert.ok(Math.abs(positions[0].y-positions[1].y)<2,'première ligne côte à côte');
              assert.ok(Math.abs(positions[2].y-positions[3].y)<2,'seconde ligne côte à côte');
              assert.ok(positions[2].y>positions[0].y,'Terminer sur seconde ligne');
              assert.ok(positions[3].x>positions[2].x,'Abandonner à droite');
              console.log('PLACEMENTS CAP OK',positions);
              // Persistance réelle : stockage navigateur et rechargement.
              await page.evaluate(() => localStorage.setItem('milft-ci-persistence','verification'));
              await page.reload({waitUntil:'load'});
              assert.equal(await page.evaluate(() => localStorage.getItem('milft-ci-persistence')),'verification','localStorage conserve au rechargement');
              await page.evaluate(() => localStorage.removeItem('milft-ci-persistence'));
              assert.match(await page.title(),/MILFT Tournois/,'application encore chargée après reload');
              // Sauvegarde applicative : deux tournois restent distincts après rechargement.
              const saved = await page.evaluate(() => {
                const previous=localStorage.getItem(KEY);
                const a={id:'ci-tournoi-a',name:'CI A',roster:[{id:'ci-a'}],tables:[{id:1,state:'free'}],matches:[]};
                const b={id:'ci-tournoi-b',name:'CI B',roster:[{id:'ci-b'}],tables:[{id:2,state:'free'}],matches:[]};
                db=initial();
                db.tournaments=[a,b];
                db.selected=a.id;
                save();
                return {key:KEY,previous};
              });
              try {
                await page.reload({waitUntil:'load'});
                const restored=await page.evaluate(() => ({
                  ids:db.tournaments.map(t=>t.id),
                  rosters:db.tournaments.map(t=>t.roster.map(p=>p.id)),
                  tables:db.tournaments.map(t=>t.tables.map(x=>x.id)),
                  selected:db.selected
                }));
                assert.deepEqual(restored.ids,['ci-tournoi-a','ci-tournoi-b'],'deux tournois restaurés');
                assert.deepEqual(restored.rosters,[['ci-a'],['ci-b']],'joueurs indépendants');
                assert.deepEqual(restored.tables,[[1],[2]],'tables indépendantes');
                assert.equal(restored.selected,'ci-tournoi-a','tournoi actif restauré');
                console.log('SAUVEGARDE APPLICATIVE ET ISOLATION OK',restored);
              } finally {
                await page.evaluate(({key,previous}) => {
                  if(previous===null)localStorage.removeItem(key);
                  else localStorage.setItem(key,previous);
                },saved);
                await page.reload({waitUntil:'load'});
              }
              console.log('RECHARGEMENT ET STOCKAGE OK');
              assert.deepEqual(errors,[],'aucune erreur JavaScript au chargement et au rechargement');
              console.log('CHROMIUM MOBILE OK',result);
            } finally { await browser.close(); }
          })().catch(error=>{console.error(error);process.exitCode=1});
          JS

name: V2.0 — MAJ93 règles multi-match candidates (émulateur seulement)
on:
  push:
    branches: [main]
    paths:
      - 'v2/database.rules.multimatch-candidate.emulator.json'
      - 'tests/v2-rtdb-multimatch-candidate.cjs'
      - '.github/workflows/v2-multimatch-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Installer émulateur et tests RTDB (aucun Firebase réel)
        run: npm install --no-save firebase-tools@14.17.0 @firebase/rules-unit-testing@5.0.0 firebase@12.6.0
      - name: Vérifier syntaxe des tests et format JSON des règles candidates
        run: |
          node --check tests/v2-rtdb-multimatch-candidate.cjs
          node -e "JSON.parse(require('fs').readFileSync('v2/database.rules.multimatch-candidate.emulator.json','utf8'))"
      - name: Vérifier les permissions multi-match sur Firebase Database Emulator uniquement
        run: npx firebase --config firebase.v2.emulator.json --project demo-milft-v2-93 emulators:exec --only database "node tests/v2-rtdb-multimatch-candidate.cjs"

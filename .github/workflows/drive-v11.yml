name: Verification Google Drive V1.1 validation
on:
  push:
    branches: [main]
    paths:
      - 'milft-drive-v11-validation.js'
      - 'tests/drive-v11.cjs'
      - 'tests/drive-v11-browser.cjs'
      - 'tests/drive-android-write.cjs'
      - 'drive-connexion-android.html'
      - 'drive-integration-fictive.html'
      - 'tests/drive-integration-fictive-browser.cjs'
      - 'MILFT_Tournois_V1_1_VALIDATION_HEBERGEMENT_STABLE_2026-11-02.html'
      - '.github/workflows/drive-v11.yml'
  workflow_dispatch:
jobs:
  drive-safety:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Google Drive mock (no real account or writes)
        run: node tests/drive-v11.cjs
      - name: Tester sauvegarde fictive Android sans compte Google réel
        run: node tests/drive-android-write.cjs
      - name: Installer Playwright pour Chromium et WebKit préinstallés
        run: |
          npm install --no-save playwright@1.56.1
          node -e "const {chromium}=require('playwright'); console.log('Chromium executable:', chromium.executablePath())"
      - name: Tester le panneau Drive en navigateur isolé sans compte réel
        run: node tests/drive-v11-browser.cjs
      - name: Tester intégration Drive réelle sur données fictives, Chrome isolé
        run: node tests/drive-integration-fictive-browser.cjs
      - name: Verify production excluded and module loaded only in validation
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const html=fs.readFileSync('MILFT_Tournois_V1_1_VALIDATION_HEBERGEMENT_STABLE_2026-11-02.html','utf8');
          assert(html.includes('milft-drive-v11-validation.js'));
          const module=fs.readFileSync('milft-drive-v11-validation.js','utf8');
          assert(module.includes("location.pathname.startsWith('/milft-tournois-validation/')"));
          assert(!html.includes('<script src="https://cdn.')||html.includes('google'));
          console.log('OK Drive validation module wired; production path excluded');
          NODE

name: Verification tables Course aux points
on:
  push:
    branches: [main]
    paths:
      - 'MILFT_Tournois_V1_1_VALIDATION_HEBERGEMENT_STABLE_2026-11-02.html'
      - '.github/workflows/milft-cap-tables.yml'
  workflow_dispatch:
jobs:
  cap-tables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Contrôler les protections des tables
        run: |
          node <<'JS'
          const fs=require('fs'),assert=require('node:assert/strict');
          const html=fs.readFileSync('MILFT_Tournois_V1_1_VALIDATION_HEBERGEMENT_STABLE_2026-11-02.html','utf8');
          const has=(s)=>assert.ok(html.includes(s),'Absent: '+s);
          has("if(state!=='free'&&capTableBusy(t,id))");
          has("if(m.bye||!m.a||!m.b)");
          has("!\u005b\u0027waiting\u0027,\u0027playing\u0027\u005d.includes(m.status)");
          has("if(m.status!=='waiting'||m.bye||m.tableId||!m.a||!m.b)continue;");
          has("if(old!=='done'&&m.status==='done'&&m.tableId!=null){m.tableId=null;save();}");
          has("if(m?.bye&&m.tableId!=null){m.tableId=null;save();}");
          has("if(removed.some(x=>capTableBusy(t,x.id)))");
          has("if(n===current)return;");
          has("if(x.state===state)return;x.state=state;save();");
          has("if(m.tableId===n)return;");
          has("if(m.tableId!=null){m.tableId=null;save();flash('Attribution de table retirée.');}");
          // Contrôles de non-régression : commandes communes et disposition 2 colonnes.
          has('function milftSharedCommandHeader({name,pills,actions})');
          has('data-shared-commands="true"');
          has('grid-template-columns:repeat(2,minmax(0,1fr))');
          has("label:'Abandonner',action:'capAbandon()'");
          has("action:'capCompClose()'");
          has("action:'capAutoAssign()'");
          // Vérifier le rendu généré des commandes, et non leur seule présence dans le fichier.
          const headerStart=html.indexOf('function milftSharedCommandHeader({name,pills,actions})');
          const headerEnd=html.indexOf(String.fromCharCode(10)+'const milftCapLiveBeforeShared',headerStart);
          assert.ok(headerStart>=0&&headerEnd>headerStart,'Générateur de commandes introuvable');
          const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
          const headerCode=html.slice(headerStart,headerEnd);
          const renderHeader=new Function('esc',headerCode+';return milftSharedCommandHeader;')(esc);
          const rendered=renderHeader({name:'Coupe test',pills:['2/4 rencontres'],actions:[
            {label:'Tour suivant',action:'capCompNext()'},
            {label:'Attribuer',action:'capAutoAssign()'},
            {label:'Terminer',action:'capCompClose()',css:'finishbtn'},
            {label:'Abandonner',action:'capAbandon()',css:'danger'}
          ]});
          assert.ok(rendered.includes('data-shared-commands="true"'));
          assert.equal((rendered.match(/<button /g)||[]).length,4);
          assert.ok(rendered.indexOf('Terminer')<rendered.indexOf('Abandonner'));
          assert.ok(rendered.includes('milft-classic-command-row'));
          const start=html.indexOf('function capAutoAssign(){');
          const end=html.indexOf('\nconst capOriginalRecordV2',start);
          assert.ok(start>=0&&end>start);
          const code=html.slice(start,end);
          let saved=0, message='';
          const t={closed:false,tables:[{id:1,state:'free'},{id:2,state:'free'}],cap:{competition:true,phase:'groups',matches:[
            {id:'bye',phase:'groups',status:'waiting',a:'A',b:null,bye:false},
            {id:'m1',phase:'groups',status:'waiting',a:'A',b:'B'},
            {id:'m2',phase:'groups',status:'waiting',a:'C',b:'D'},
            {id:'m3',phase:'groups',status:'waiting',a:'E',b:'F'}]}};
          const active=()=>t;
          const capActiveMatches=(x)=>x.cap.matches.filter(m=>m.phase===x.cap.phase);
          const capFreeTable=(x,id)=>x.tables.some(v=>v.id===id&&v.state==='free')&&!x.cap.matches.some(m=>m.tableId===id&&m.status!=='done');
          const save=()=>saved++;
          const flash=(s)=>message=s;
          eval(code+';capAutoAssign();');
          assert.equal(t.cap.matches[0].tableId,undefined);
          assert.equal(t.cap.matches[1].tableId,1);
          assert.equal(t.cap.matches[2].tableId,2);
          assert.equal(t.cap.matches[3].tableId,undefined);
          assert.equal(saved,1);
          // Second passage : aucune attribution supplémentaire et aucune collision.
          eval(code+';capAutoAssign();');
          assert.equal(t.cap.matches[1].tableId,1);
          assert.equal(t.cap.matches[2].tableId,2);
          assert.equal(t.cap.matches[3].tableId,undefined);
          assert.equal(saved,1,'Une attribution sans changement ne doit pas sauvegarder');
          // Une table libérée ne doit être réattribuée qu'à une rencontre complète.
          t.cap.matches[1].status='done';
          t.cap.matches[1].tableId=null;
          eval(code+';capAutoAssign();');
          assert.equal(t.cap.matches[3].tableId,1);
          assert.equal(t.cap.matches[0].tableId,undefined);
          // Une table en maintenance ne peut pas être attribuée.
          t.cap.matches[3].status='done';
          t.cap.matches[3].tableId=null;
          t.tables[0].state='maintenance';
          eval(code+';capAutoAssign();');
          assert.equal(t.cap.matches[0].tableId,undefined);
          // Parcours fonctionnel de l'attribution manuelle : état, collision, changement et retrait.
          const manualStart=html.indexOf('capAssignTable=function(id){');
          const manualEnd=html.indexOf(String.fromCharCode(10)+'function capAutoAssign(){',manualStart);
          assert.ok(manualStart>=0&&manualEnd>manualStart,'Attribution manuelle introuvable');
          const manualCode=html.slice(manualStart,manualEnd);
          const manualMatch={id:'manual',status:'waiting',a:'A',b:'B',tableId:null};
          const otherMatch={id:'other',status:'waiting',a:'C',b:'D',tableId:2};
          const manualTournament={closed:false,tables:[{id:1,state:'free'},{id:2,state:'free'},{id:3,state:'maintenance'}],cap:{matches:[manualMatch,otherMatch]}};
          let chosen='1',manualSaves=0,manualAlerts=[];
          const manualAssign=new Function('active','document','capFreeTable','save','flash','alert',
            manualCode+';return capAssignTable;')(
            ()=>manualTournament,
            {getElementById:()=>({get value(){return chosen;}})},
            (x,id,except)=>x.tables.some(v=>v.id===id&&v.state==='free')&&!x.cap.matches.some(m=>m.id!==except&&m.tableId===id&&m.status!=='done'),
            ()=>manualSaves++,()=>{},s=>manualAlerts.push(s));
          manualAssign('manual');
          assert.equal(manualMatch.tableId,1);assert.equal(manualSaves,1);
          manualAssign('manual');
          assert.equal(manualSaves,1,'Table identique : pas de sauvegarde');
          chosen='2';manualAssign('manual');
          assert.equal(manualMatch.tableId,1);assert.equal(manualAlerts.length,1,'Collision refusée');
          chosen='3';manualAssign('manual');
          assert.equal(manualMatch.tableId,1);assert.equal(manualAlerts.length,2,'Maintenance refusée');
          chosen='';manualAssign('manual');
          assert.equal(manualMatch.tableId,null);assert.equal(manualSaves,2);
          manualAssign('manual');
          assert.equal(manualSaves,2,'Retrait répété : pas de sauvegarde');
          manualMatch.status='abandoned';chosen='1';manualAssign('manual');
          assert.equal(manualMatch.tableId,null,'Rencontre abandonnée protégée');
          manualMatch.status='waiting';manualMatch.bye=true;manualAssign('manual');
          assert.equal(manualMatch.tableId,null,'BYE protégé');
          console.log('OK: parcours manuel, collisions, maintenance, retrait, abandon et BYE.');
          // Parcours de gestion du parc : exclusion, maintenance, occupation et réouverture.
          const stateStart=html.indexOf('function capSetTable(id){');
          const stateEnd=html.indexOf(String.fromCharCode(10)+'function capAssignTable(id){',stateStart);
          assert.ok(stateStart>=0&&stateEnd>stateStart,'Gestion des états introuvable');
          const stateCode=html.slice(stateStart,stateEnd);
          let stateChoice='maintenance',stateSaves=0,stateAlerts=[];
          const stateSet=new Function('active','document','capTableBusy','save','flash','alert',
            stateCode+';return capSetTable;')(
            ()=>manualTournament,
            {getElementById:()=>({get value(){return stateChoice;}})},
            (x,id)=>x.cap.matches.some(m=>m.tableId===id&&m.status!=='done'&&m.status!=='abandoned'),
            ()=>stateSaves++,()=>{},s=>stateAlerts.push(s));
          stateSet(1);
          assert.equal(manualTournament.tables[0].state,'maintenance');
          assert.equal(stateSaves,1);
          stateSet(1);
          assert.equal(stateSaves,1,'Etat identique sans nouvelle sauvegarde');
          stateChoice='excluded';stateSet(2);
          assert.equal(manualTournament.tables[1].state,'free','Table occupée non exclue');
          assert.equal(stateAlerts.length,1);
          otherMatch.status='done';stateSet(2);
          assert.equal(manualTournament.tables[1].state,'excluded','Table libérée excluable');
          assert.equal(stateSaves,2);
          stateChoice='free';stateSet(2);
          assert.equal(manualTournament.tables[1].state,'free','Table réouverte');
          assert.equal(stateSaves,3);
          manualTournament.closed=true;stateChoice='maintenance';stateSet(2);
          assert.equal(manualTournament.tables[1].state,'free','Compétition close protégée');
          assert.equal(stateSaves,3);
          console.log('OK: états des tables, occupation, exclusion, réouverture et clôture.');
          // Parcours du dimensionnement : agrandir, réduire, refuser table occupée.
          const countStart=html.indexOf('function capSetTableCount(){');
          const countEnd=html.indexOf(String.fromCharCode(10)+'function capTableControlsModern(',countStart);
          assert.ok(countStart>=0&&countEnd>countStart,'Gestion du nombre de tables introuvable');
          const countCode=html.slice(countStart,countEnd);
          const countTournament={closed:false,tables:[{id:1,state:'free'},{id:2,state:'free'}],cap:{matches:[{id:'match',tableId:2,status:'playing'}]}};
          let requested=4,countSaves=0,confirmations=0,countAlerts=[];
          const setCount=new Function('active','document','capTableBusy','confirm','alert','save','flash',
            countCode+';return capSetTableCount;')(
            ()=>countTournament,
            {getElementById:()=>({get value(){return String(requested);}})},
            (x,id)=>x.cap.matches.some(m=>m.tableId===id&&m.status!=='done'),
            ()=>{confirmations++;return true;},
            s=>countAlerts.push(s),()=>countSaves++,()=>{});
          setCount();
          assert.equal(countTournament.tables.length,4);
          assert.equal(countSaves,1);
          setCount();assert.equal(countSaves,1,'Nombre inchangé sans sauvegarde');
          requested=1;setCount();
          assert.equal(countTournament.tables.length,4,'Table occupée conservée');
          assert.equal(countAlerts.length,1);
          countTournament.cap.matches[0].status='done';
          setCount();
          assert.equal(countTournament.tables.length,1);
          assert.equal(confirmations,1);
          assert.equal(countSaves,2);
          requested=33;setCount();
          assert.equal(countTournament.tables.length,1,'Limite supérieure respectée');
          countTournament.closed=true;requested=3;setCount();
          assert.equal(countTournament.tables.length,1,'Clôture protégée');
          console.log('OK: agrandissement, réduction, occupation, bornes et clôture.');
          // Parcours de clôture : refus des matchs en attente, validation, puis réouverture.
          const closeStart=html.indexOf('function capCompClose(){');
          const closeEnd=html.indexOf(String.fromCharCode(10)+'function capCompLive(t)',closeStart);
          assert.ok(closeStart>=0&&closeEnd>closeStart,'Clôture Course aux points introuvable');
          const closeCode=html.slice(closeStart,closeEnd);
          const closeTournament={closed:false,cap:{phase:'league',bracket:false,matches:[
            {id:'a',status:'done'},{id:'b',status:'waiting'}]}};
          let closeSaves=0,closeAlerts=[];
          const closeFn=new Function('active','alert','save','flash','capCompScore',
            closeCode+';return capCompClose;')(
            ()=>closeTournament,s=>closeAlerts.push(s),()=>closeSaves++,()=>{},()=>({a:30,b:24}));
          closeFn();
          assert.equal(closeTournament.closed,false,'Rencontre en attente : clôture refusée');
          assert.equal(closeSaves,0);
          assert.equal(closeAlerts.length,1);
          closeTournament.cap.matches[1].status='done';
          closeFn();
          assert.equal(closeTournament.closed,true,'Championnat terminé clôturable');
          assert.equal(closeSaves,1);
          closeFn();
          assert.equal(closeTournament.closed,false,'Réouverture possible');
          assert.equal(closeSaves,2);
          closeTournament.cap.bracket=true;closeTournament.cap.phase='groups';
          closeFn();
          assert.equal(closeTournament.closed,false,'Tableau final requis');
          console.log('OK: clôture, refus si incomplet, réouverture et tableau final requis.');



          console.log('OK: BYE, absence de doublon, réattribution et maintenance.');
          JS

name: V2.0 — MAJ94 interface multi-match sur émulateurs isolés
on:
  push:
    branches: [main]
    paths:
      - 'v2/mobile-multimatch-emulator.html'
      - 'v2/mobile-multimatch-emulator.mjs'
      - 'v2/outbox-multimatch-emulator.js'
      - 'v2/score-formats-emulator.mjs'
      - 'v2/draft-multimatch-emulator.mjs'
      - 'v2/database.rules.multimatch-candidate.emulator.json'
      - 'firebase.v2.multimatch.emulator.json'
      - 'tests/v2-mobile-multimatch-emulator-e2e.cjs'
      - 'tests/v2-multimatch-draft-safety.cjs'
      - '.github/workflows/v2-mobile-multimatch-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-devices:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Installer les SDK et émulateurs locaux uniquement
        run: npm install --no-save firebase-tools@14.17.0 @firebase/rules-unit-testing@5.0.0 firebase@12.6.0 playwright@1.56.1 esbuild@0.25.12
      - name: Vérifier les fichiers d'essai MAJ94
        run: |
          node --check tests/v2-mobile-multimatch-emulator-e2e.cjs
          node --check v2/mobile-multimatch-emulator.mjs
          node --check v2/draft-multimatch-emulator.mjs
          node --check tests/v2-multimatch-draft-safety.cjs
          node tests/v2-multimatch-draft-safety.cjs
          node -e "const c=require('./firebase.v2.multimatch.emulator.json');if(c.database.rules!=='v2/database.rules.multimatch-candidate.emulator.json')process.exit(1)"
      - name: Deux appareils simulés, deux matchs, conflits, rôles et réseau
        run: npx firebase --config firebase.v2.multimatch.emulator.json --project demo-milft-v2-94 emulators:exec --only auth,database "node tests/v2-mobile-multimatch-emulator-e2e.cjs"

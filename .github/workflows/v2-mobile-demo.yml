name: V2.0 — interface démonstration Android (isolée)
on:
  push:
    branches: [main]
    paths:
      - 'v2/mobile-demo.html'
      - 'v2/mobile-demo.mjs'
      - 'v2/firebase-config.mjs'
      - 'v2/outbox-idb.js'
      - 'tests/v2-mobile-demo-browser.cjs'
      - '.github/workflows/v2-mobile-demo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: node --check v2/mobile-demo.mjs
      - name: Android Chromium — interface V2 sans backend
        run: node tests/v2-mobile-demo-browser.cjs
      - name: Safari WebKit — interface V2 sans backend
        env:
          MILFT_BROWSER: webkit
        run: node tests/v2-mobile-demo-browser.cjs

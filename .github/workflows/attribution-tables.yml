name: Verification attribution tables V1.1
on:
  push:
    branches: [main]
    paths:
      - 'MILFT_Tournois_V1_1_VALIDATION_HEBERGEMENT_STABLE_2026-11-02.html'
      - 'tests/attribution-tables.cjs'
      - 'tests/backup-restore.cjs'
      - 'tests/browser-smoke.cjs'
      - 'tests/formats-browser.cjs'
      - 'tests/indexeddb-browser.cjs'
      - 'tests/backup-linked-collision.cjs'
      - 'tests/stale-match-eta.cjs'
      - '.github/workflows/attribution-tables.yml'
  workflow_dispatch:
jobs:
  verifier:
    runs-on: ubuntu-24.04 # Playwright 1.56.1 ne supporte pas encore Ubuntu 26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntaxe JS et controles attribution
        run: |
          node tests/attribution-tables.cjs
          node tests/backup-restore.cjs
          node tests/stale-match-eta.cjs
      - name: Installer Chromium pour la recette visuelle isolée
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Recette Chromium mobile et PC (données fictives)
        run: |
          node tests/browser-smoke.cjs
          node tests/formats-browser.cjs
          node tests/indexeddb-browser.cjs
          node tests/backup-linked-collision.cjs
      - name: Captures de recette automatique
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milft-historique-chromium
          path: test-results/*.png
          if-no-files-found: ignore

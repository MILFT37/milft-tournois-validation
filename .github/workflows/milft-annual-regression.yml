name: Verification parcours championnat annuel Simple
on:
  push:
    branches: [main]
    paths: [.github/workflows/milft-annual-regression.yml, MILFT_Tournois_V1_1_VALIDATION_HEBERGEMENT_STABLE_2026-11-02.html]
  workflow_dispatch:
jobs:
  annual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright avec limites de temps
        timeout-minutes: 5
        run: |
          npm config set fetch-retries 1
          npm config set fetch-timeout 30000
          timeout 120s npm install --no-save playwright
          timeout 150s npx playwright install --with-deps chromium
      - run: python3 -m http.server 8766 --bind 127.0.0.1 >/tmp/milft-annual-http.log 2>&1 &
      - name: Tester presences, rencontres, ajout joueur, classement, tables et reprise
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext();
            const p=await context.newPage();
            p.on('dialog',d=>d.accept());
            const errors=[];p.on('pageerror',e=>errors.push(e.message));
            await p.goto('http://127.0.0.1:8766/MILFT_Tournois_V1_1_VALIDATION_HEBERGEMENT_STABLE_2026-11-02.html');
            // Regression UI : les presences restent depliees a chaque coche/decochage.
            await p.evaluate(()=>{
              db.players=[{id:'a',first:'Alice',last:'TEST'},{id:'b',first:'Bob',last:'TEST'},{id:'c',first:'Chloe',last:'TEST'}];
              db.tournaments=[{id:'annual-ci',name:'Saison fictive CI',mode:'challenge',discipline:'single',closed:false,legs:1,roster:db.players.slice(),presence:{a:false,b:false,c:false},matches:[],tables:[{id:1,state:'free'}]}];
              db.selected='annual-ci';tab='live-detail';save();render();
            });
            const presencePanel=p.locator('.milft-annual-presence details');
            await presencePanel.locator('summary').click();
            assert.equal(await presencePanel.evaluate(el=>el.open),true,'Impossible de depl ier les presences');
            const checks=presencePanel.locator('.milft-presence-compact input[type="checkbox"]');
            for(let i=0;i<3;i++){
              await checks.nth(i).check();
              assert.equal(await presencePanel.evaluate(el=>el.open),true,'Panneau replie apres presence '+i);
            }
            assert.ok((await presencePanel.locator('summary').innerText()).includes('3/3'),'Compteur de presences non actualise');
            await checks.nth(1).uncheck();
            assert.equal(await presencePanel.evaluate(el=>el.open),true,'Panneau replie apres deselection');
            assert.ok((await presencePanel.locator('summary').innerText()).includes('2/3'),'Compteur apres deselection incorrect');
            // Priorite de relance : un match reporte et reactive passe devant un match ordinaire.
            const priority=await p.evaluate(()=>{
              const t=db.tournaments.find(t=>t.id==='annual-ci');
              const old=t.matches,oldPresence={...t.presence};
              // Isoler ce scenario des absences utilisees dans le test UI precedent.
              t.presence={...t.presence,a:true,b:true,c:true};
              t.matches=[
                {id:'ordinaire',a:'a',b:'b',status:'waiting',hold:false,sets:[]},
                {id:'reprise',a:'a',b:'c',status:'waiting',hold:true,sets:[{a:5,b:3}]}
              ];
              const before=milftAnnualNextMatch(t,new Set())?.id;
              t.matches[1].hold=false;
              t.matches[1].annualResumePriority=true;
              const after=milftAnnualNextMatch(t,new Set())?.id;
              const sets=t.matches[1].sets.length;
              // Une relance ne contourne ni les absences ni les joueurs occupes.
              t.presence.c=false;
              const absent=milftAnnualNextMatch(t,new Set())?.id;
              t.presence.c=true;
              const occupied=milftAnnualNextMatch(t,new Set(['c']))?.id;
              const allBusy=milftAnnualNextMatch(t,new Set(['a']))?.id;
              t.matches[1].hold=true;
              const held=milftAnnualNextMatch(t,new Set())?.id;
              t.matches=old;t.presence=oldPresence;
              return {before,after,sets,absent,occupied,allBusy,held};
            });
            assert.equal(priority.before,'ordinaire','Un match en attente ne doit pas etre attribue');
            assert.equal(priority.after,'reprise','Le match relance doit etre prioritaire');
            assert.equal(priority.sets,1,'La reprise doit conserver les manches');
            assert.equal(priority.absent,'ordinaire','Relance attribuee malgre joueur absent');
            assert.equal(priority.occupied,'ordinaire','Relance attribuee malgre joueur occupe');
            assert.equal(priority.allBusy,undefined,'Rencontre attribuee malgre joueur commun occupe');
            assert.equal(priority.held,'ordinaire','Rencontre encore reportee attribuee');
            // Attribution auto : tables libres, joueurs non doubles, reprise prioritaire.
            const assignment=await p.evaluate(()=>{
              const original=db.tournaments.find(t=>t.id==='annual-ci');
              const t={...original,mode:'challenge',roundLimit:false,
                roster:[],presence:{a:true,b:true,c:true,d:true,e:true,f:true},
                tables:[{id:1,state:'free'},{id:2,state:'free'}],
                matches:[
                  {id:'ordinaire',a:'a',b:'b',status:'waiting',hold:false,sets:[]},
                  {id:'reprise',a:'a',b:'c',status:'waiting',hold:false,annualResumePriority:true,sets:[{a:5,b:3}]},
                  {id:'independant',a:'d',b:'e',status:'waiting',hold:false,sets:[]}
                ]};
              autoAssign(t);
              const result={matches:t.matches.map(m=>({id:m.id,status:m.status,table:m.table,priority:m.annualResumePriority,sets:m.sets.length})),tables:t.tables.map(x=>({id:x.id,state:x.state}))};
              autoAssign(t);
              result.afterSecond=t.matches.map(m=>({id:m.id,status:m.status,table:m.table}));
              return result;
            });
            assert.equal(assignment.matches.find(m=>m.id==='reprise').status,'playing','Relance non attribuee en priorite');
            assert.equal(assignment.matches.find(m=>m.id==='reprise').table,1,'Premiere table libre non utilisee');
            assert.equal(assignment.matches.find(m=>m.id==='reprise').sets,1,'Manches perdues pendant attribution');
            assert.equal(assignment.matches.find(m=>m.id==='reprise').priority,false,'Priorite non effacee apres attribution');
            assert.equal(assignment.matches.find(m=>m.id==='ordinaire').status,'waiting','Joueur affecte a deux rencontres');
            assert.equal(assignment.matches.find(m=>m.id==='independant').table,2,'Seconde table libre non utilisee');
            assert.ok(assignment.tables.every(t=>t.state==='playing'),'Etat des tables non synchronise');
            assert.deepEqual(assignment.afterSecond,assignment.matches.map(m=>({id:m.id,status:m.status,table:m.table})),'Seconde attribution a modifie des matchs en cours');
            // Une table indisponible reste exclue ; une liberation permet la reprise.
            const tableRecovery=await p.evaluate(()=>{
              const original=db.tournaments.find(t=>t.id==='annual-ci');
              const t={...original,mode:'challenge',roundLimit:false,roster:[],
                presence:{a:true,b:true,c:true,d:true},
                tables:[{id:1,state:'playing'},{id:2,state:'free'},{id:3,state:'excluded'}],
                matches:[
                  {id:'actif',a:'a',b:'b',status:'playing',table:1,hold:false,sets:[]},
                  {id:'attente',a:'c',b:'d',status:'waiting',hold:false,sets:[]}
                ]};
              autoAssign(t);
              const first={waiting:t.matches[1].status,table:t.matches[1].table,excluded:t.tables[2].state,active:t.matches[0].status};
              // Nouvelle rencontre eligible, mais aucune table libre.
              t.matches.push({id:'suivant',a:'a',b:'b',status:'waiting',hold:false,sets:[]});
              autoAssign(t);
              const noFree=t.matches[2].status;
              t.matches[0].status='done';t.tables[0].state='free';
              autoAssign(t);
              return {first,noFree,recovered:{status:t.matches[2].status,table:t.matches[2].table},excluded:t.tables[2].state};
            });
            assert.equal(tableRecovery.first.waiting,'playing','Table libre non utilisee');
            assert.equal(tableRecovery.first.table,2,'Table indisponible utilisee');
            assert.equal(tableRecovery.first.active,'playing','Match deja en cours modifie');
            assert.equal(tableRecovery.noFree,'waiting','Match attribue sans table libre');
            assert.equal(tableRecovery.recovered.status,'playing','Match non repris apres liberation');
            assert.equal(tableRecovery.recovered.table,1,'Table liberee non reutilisee');
            assert.equal(tableRecovery.excluded,'excluded','Table exclue modifiee');
            // Presence : ne jamais attribuer un match avec un absent ; reprise apres retour.
            const presenceAssignment=await p.evaluate(()=>{
              const original=db.tournaments.find(t=>t.id==='annual-ci');
              const t={...original,mode:'challenge',roundLimit:false,roster:[],
                presence:{a:true,b:false,c:true,d:true},
                tables:[{id:1,state:'free'},{id:2,state:'free'}],
                matches:[
                  {id:'absent',a:'a',b:'b',status:'waiting',hold:false,sets:[]},
                  {id:'present',a:'c',b:'d',status:'waiting',hold:false,sets:[]}
                ]};
              autoAssign(t);
              const first={absent:t.matches[0].status,present:t.matches[1].status,presentTable:t.matches[1].table,free:t.tables[1].state};
              t.presence.b=true;
              autoAssign(t);
              return {first,after:{absent:t.matches[0].status,table:t.matches[0].table,playing:t.matches[1].status}};
            });
            assert.equal(presenceAssignment.first.absent,'waiting','Match attribue avec joueur absent');
            assert.equal(presenceAssignment.first.present,'playing','Match de joueurs presents non attribue');
            assert.equal(presenceAssignment.first.presentTable,1,'Table libre non attribuee aux presents');
            assert.equal(presenceAssignment.first.free,'free','Table reservee pour un joueur absent');
            assert.equal(presenceAssignment.after.absent,'playing','Match non attribue apres retour du joueur');
            assert.equal(presenceAssignment.after.table,2,'Mauvaise table attribuee apres retour');
            assert.equal(presenceAssignment.after.playing,'playing','Match precedent interrompu');
            // Ajout de joueurs : plusieurs cases doivent pouvoir etre cochees sans repli.
            await p.evaluate(()=>{
              db.players.push({id:'d',first:'David',last:'TEST'},{id:'e',first:'Emma',last:'TEST'});
              save();render();
            });
            const addPanel=p.locator('.milft-annual-add details');
            await addPanel.locator('summary').click();
            const newPlayerChecks=addPanel.locator('input[name="annualNew"]');
            assert.equal(await newPlayerChecks.count(),2,'Deux joueurs disponibles attendus');
            await newPlayerChecks.nth(0).check();
            assert.equal(await addPanel.evaluate(el=>el.open),true,'Ajout replie apres premier choix');
            await newPlayerChecks.nth(1).check();
            assert.equal(await addPanel.evaluate(el=>el.open),true,'Ajout replie apres second choix');
            assert.equal(await newPlayerChecks.filter({checked:true}).count(),2,'Selection multiple non conservee');
            await p.reload();
            assert.equal(await p.evaluate(()=>db.tournaments.find(t=>t.id==='annual-ci').presence.b),false,'Deselection non sauvegardee');
            assert.equal(await p.evaluate(()=>db.tournaments.find(t=>t.id==='annual-ci').presence.a),true,'Presence non sauvegardee');
            const state=await p.evaluate(()=>{
              const check=(ok,msg)=>{if(!ok)throw Error(msg)};
              db.players=[{id:'a',first:'Alice',last:'TEST'},{id:'b',first:'Bob',last:'TEST'},{id:'c',first:'Chloe',last:'TEST'}];
              db.tournaments=[{id:'annual-ci',name:'Saison fictive CI',mode:'challenge',discipline:'single',closed:false,legs:1,roster:db.players.slice(0,2),presence:{a:true,b:false},matches:[{id:'ab',a:'a',b:'b',leg:1,status:'waiting',table:null,sets:[],score:null,hold:false}],tables:[{id:1,state:'free'},{id:2,state:'free'},{id:3,state:'free'},{id:4,state:'free'}]}];
              db.selected='annual-ci';save();
              autoNow();
              let t=active(),m=t.matches[0];
              check(m.status==='waiting','Un absent a ete programme');
              t.presence.b=true;save();autoNow();
              check(m.status==='playing'&&m.table===1,'Attribution premiere table incorrecte');
              m.sets=[{a:5,b:3},{a:5,b:2},{a:5,b:1}];m.score={a:3,b:0};m.status='done';t.tables[0].state='free';m.table=null;save();
              check(challengeStandings(t).includes('Alice'),'Classement absent');
              const before=t.matches.find(x=>x.id==='ab').score.a;
              const fake={preventDefault(){},target:{querySelectorAll(){return [{value:'c'}]}}};
              addAnnualParticipants(fake);
              t=active();
              check(t.roster.length===3,'Ajout joueur perdu');
              check(t.matches.length===3,'Rencontres du nouveau joueur incorrectes');
              check(t.matches.find(x=>x.id==='ab').score.a===before,'Ancien resultat modifie');
              check(t.presence.c===false,'Nouveau joueur doit etre absent par defaut');
              const sorted=milftPlayingByTable([{table:2},{table:4},{table:1},{table:3}]);
              check(sorted.map(x=>x.table).join(',')==='1,2,3,4','Ordre des tables incorrect');
              save();
              return {roster:t.roster.map(x=>x.id),matchCount:t.matches.length,score:t.matches.find(x=>x.id==='ab').score};
            });
            await p.reload();
            const restored=await p.evaluate(()=>{
              const t=db.tournaments.find(x=>x.id==='annual-ci');
              return t&&{roster:t.roster.map(x=>x.id),matchCount:t.matches.length,score:t.matches.find(x=>x.id==='ab')?.score};
            });
            assert.deepEqual(restored,state,'La reprise a modifie la saison');
            const sessions=await p.evaluate(()=>{
              const check=(ok,msg)=>{if(!ok)throw Error(msg)};
              let t=active();
              // Seance 2 : Bob absent, Chloe presente; les scores de seance 1 restent inchanges.
              t.presence={a:true,b:false,c:true};save();
              const previous=t.matches.find(m=>m.id==='ab');
              check(previous.status==='done'&&previous.score.a===3,'Resultat seance 1 perdu');
              autoNow();
              const current=t.matches.find(m=>m.status==='playing');
              check(current&&[current.a,current.b].includes('c'),'Seance 2 non lancee');
              check(current.a!=='b'&&current.b!=='b','Absent lance en seance 2');
              current.sets=[{a:5,b:2},{a:5,b:3},{a:5,b:4}];
              current.score={a:3,b:0};current.status='done';
              const table=t.tables.find(x=>x.id===current.table);if(table)table.state='free';
              current.table=null;save();
              check(t.matches.filter(m=>m.status==='done').length===2,'Deux resultats attendus');
              return {first:previous.score,secondId:current.id,second:current.score,done:2};
            });
            await p.reload();
            const resumed=await p.evaluate(()=>{
              const t=db.tournaments.find(x=>x.id==='annual-ci');
              const first=t.matches.find(x=>x.id==='ab');
              const second=t.matches.find(x=>x.status==='done'&&x.id!=='ab');
              return {first:first.score,secondId:second?.id,second:second?.score,done:t.matches.filter(x=>x.status==='done').length};
            });
            assert.deepEqual(resumed,sessions,'Reprise apres deux seances incorrecte');
            const correction=await p.evaluate(()=>{
              const t=active(),m=t.matches.find(x=>x.id==='ab');
              const original=JSON.stringify(m);
              const originalPrompt=window.prompt,originalConfirm=window.confirm;
              try{
                window.prompt=()=>null;
                correctChallenge('ab');
                if(JSON.stringify(m)!==original)throw Error('Annulation a modifie le resultat');
                const answers=['3-5','2-5','1-5'];
                window.prompt=()=>answers.shift();
                window.confirm=()=>true;
                correctChallenge('ab');
                if(m.status!=='done'||m.score.a!==0||m.score.b!==3||m.sets.length!==3)throw Error('Correction du vainqueur incorrecte');
                const html=challengeStandings(t);
                if(!html.includes('Bob TEST')||!html.includes('Alice TEST'))throw Error('Classement non disponible apres correction');
                save();
                return {score:m.score,sets:m.sets,done:t.matches.filter(x=>x.status==='done').length,standing:html.indexOf('Bob TEST')<html.indexOf('Alice TEST')};
              }finally{window.prompt=originalPrompt;window.confirm=originalConfirm}
            });
            assert.equal(correction.standing,true,'Classement non recalcule apres inversion du vainqueur');
            await p.reload();
            const corrected=await p.evaluate(()=>{
              const t=db.tournaments.find(x=>x.id==='annual-ci'),m=t.matches.find(x=>x.id==='ab'),html=challengeStandings(t);
              return {score:m.score,sets:m.sets,done:t.matches.filter(x=>x.status==='done').length,standing:html.indexOf('Bob TEST')<html.indexOf('Alice TEST')};
            });
            assert.deepEqual(corrected,correction,'Correction perdue apres rechargement');
            // Isolation : une seconde competition ne doit pas etre modifiee par les operations sur l'annuel.
            const isolated=await p.evaluate(()=>{
              const annual=db.tournaments.find(t=>t.id==='annual-ci');
              const other=JSON.parse(JSON.stringify(annual));
              other.id='other-ci';other.name='Autre tournoi independant';
              other.matches=other.matches.map(m=>({...m,id:'other-'+m.id}));
              db.tournaments.push(other);
              db.selected='annual-ci';save();
              return JSON.stringify(other);
            });
            await p.reload();
            assert.equal(await p.evaluate(()=>JSON.stringify(db.tournaments.find(t=>t.id==='other-ci'))),isolated,'Autre tournoi modifie au rechargement');
            await p.evaluate(()=>{
              const annual=db.tournaments.find(t=>t.id==='annual-ci');
              annual.presence.a=false;save();
            });
            assert.equal(await p.evaluate(()=>JSON.stringify(db.tournaments.find(t=>t.id==='other-ci'))),isolated,'Modification de presence annuelle repercutee sur un autre tournoi');
            await p.reload();
            assert.equal(await p.evaluate(()=>JSON.stringify(db.tournaments.find(t=>t.id==='other-ci'))),isolated,'Isolation perdue apres rechargement');
            // Export complet de la saison apres deux seances et correction.
            const [backup]=await Promise.all([
              p.waitForEvent('download'),
              p.evaluate(()=>milftExportBackup())
            ]);
            const backupPath=await backup.path();
            assert.ok(backupPath,'Export JSON absent');
            const clean=await browser.newContext({acceptDownloads:true});
            const q=await clean.newPage();
            let cancelNextRestore=false;
            q.on('dialog',d=>cancelNextRestore&&d.type()==='confirm'?d.dismiss():d.accept());
            q.on('pageerror',e=>errors.push(e.message));
            await q.goto('http://127.0.0.1:8766/MILFT_Tournois_V1_1_VALIDATION_HEBERGEMENT_STABLE_2026-11-02.html');
            await q.locator('#milft-backup-file').setInputFiles(backupPath);
            await q.waitForFunction(()=>typeof db!=='undefined'&&db.tournaments.some(t=>t.id==='annual-ci'));
            const inspect=()=>{const t=db.tournaments.find(x=>x.id==='annual-ci');if(!t)return null;const m=t.matches.find(x=>x.id==='ab');const second=t.matches.find(x=>x.status==='done'&&x.id!=='ab');const html=challengeStandings(t);return {roster:t.roster.map(x=>x.id),matchCount:t.matches.length,done:t.matches.filter(x=>x.status==='done').length,first:m.score,firstSets:m.sets,secondId:second?.id,second:second?.score,presence:t.presence,rankingBobBeforeAlice:html.indexOf('Bob TEST')<html.indexOf('Alice TEST')};};
            const reference=await p.evaluate(inspect);
            const otherReference=await p.evaluate(()=>JSON.stringify(db.tournaments.find(t=>t.id==='other-ci')));
            const imported=await q.evaluate(inspect);
            assert.deepEqual(imported,reference,'Import de la saison complete non conforme');
            assert.equal(await q.evaluate(()=>JSON.stringify(db.tournaments.find(t=>t.id==='other-ci'))),otherReference,'Autre tournoi perdu pendant restauration');
            await q.reload();
            const reopened=await q.evaluate(inspect);
            assert.deepEqual(reopened,reference,'Reprise de la saison restauree non conforme');
            assert.equal(await q.evaluate(()=>JSON.stringify(db.tournaments.find(t=>t.id==='other-ci'))),otherReference,'Autre tournoi perdu apres rechargement');
            // Une archive malformee ne doit jamais remplacer la saison restauree.
            const beforeInvalid=await q.evaluate(inspect);
            await q.locator('#milft-backup-file').setInputFiles({
              name:'archive-invalide.json',mimeType:'application/json',
              buffer:Buffer.from(JSON.stringify({format:'MILFT-TOURNOIS-BACKUP',version:1,data:{players:[],tournaments:[{id:'bad',mode:'challenge',roster:[],matches:[],tables:[{id:1,state:'playing'}]}]}}))
            });
            await q.waitForFunction(()=>document.querySelector('#milft-backup-file')?.value==='');
            assert.deepEqual(await q.evaluate(inspect),beforeInvalid,'Archive invalide a ecrase les donnees');
            await q.reload();
            assert.deepEqual(await q.evaluate(inspect),beforeInvalid,'Archive invalide a modifie la sauvegarde locale');
            // Une restauration valide annulee au premier avertissement ne remplace rien.
            const fs=require('node:fs');
            const altered=JSON.parse(fs.readFileSync(backupPath,'utf8'));
            altered.data.tournaments.find(t=>t.id==='annual-ci').name='SAISON REMPLACEE';
            cancelNextRestore=true;
            await q.locator('#milft-backup-file').setInputFiles({
              name:'archive-valide-modifiee.json',mimeType:'application/json',
              buffer:Buffer.from(JSON.stringify(altered))
            });
            await q.waitForFunction(()=>document.querySelector('#milft-backup-file')?.value==='');
            cancelNextRestore=false;
            assert.deepEqual(await q.evaluate(inspect),beforeInvalid,'Annulation a modifie la saison');
            assert.equal(await q.evaluate(()=>db.tournaments.find(t=>t.id==='annual-ci').name),'Saison fictive CI','Annulation a remplace le tournoi');
            await q.reload();
            assert.deepEqual(await q.evaluate(inspect),beforeInvalid,'Annulation non preservee apres rechargement');
            await clean.close();
            assert.deepEqual(errors,[],'Erreurs JavaScript');
            console.log('OK: absence, lancement, resultat, classement, ajout joueur, tables 1-4, deux seances, correction de vainqueur, annulation, export JSON, restauration vierge, refus de sauvegarde invalide et reprise.');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

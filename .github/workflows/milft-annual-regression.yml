name: Verification parcours championnat annuel Simple
on:
  push:
    branches: [main]
    paths: [.github/workflows/milft-annual-regression.yml, MILFT_Tournois_V1_1_VALIDATION_HEBERGEMENT_STABLE_2026-11-02.html, MILFT_CHAMPIONNAT_SIMPLE_2026-11-05.html]
  workflow_dispatch:
jobs:
  annual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright avec limites de temps
        timeout-minutes: 5
        run: |
          npm config set fetch-retries 1
          npm config set fetch-timeout 30000
          timeout 120s npm install --no-save playwright
          timeout 150s npx playwright install chromium
      - run: python3 -m http.server 8766 --bind 127.0.0.1 >/tmp/milft-annual-http.log 2>&1 &
      - name: Tester presences, rencontres, ajout joueur, classement, tables et reprise
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext();
            const p=await context.newPage();
            p.on('dialog',d=>d.accept());
            const errors=[];p.on('pageerror',e=>errors.push(e.message));
            await p.goto('http://127.0.0.1:8766/MILFT_Tournois_V1_1_VALIDATION_HEBERGEMENT_STABLE_2026-11-02.html');
            // Course aux points : commandes harmonisees, 2 colonnes et Terminer/Abandonner en ligne 2.
            const capUi=await p.evaluate(()=>{
              const t={name:'Coupe test',closed:false};
              const host=document.createElement('div');
              host.innerHTML=milftCapUnifiedHeader(t,'Course aux points','0/6 relais','capClose()','Terminer');
              const buttons=[...host.querySelectorAll('.milft-cap-actions button')];
              const grid=host.querySelector('.milft-cap-actions');
              return {count:buttons.length,labels:buttons.map(b=>b.textContent.trim()),columns:grid?.style.gridTemplateColumns,gap:grid?.style.gap,finish:buttons[2]?.className,abandon:buttons[3]?.className};
            });
            assert.equal(capUi.count,4,'Course aux points : quatre commandes attendues');
            assert.deepEqual(capUi.labels,['Tournois en cours','Avancement','Terminer','Abandonner'],'Ordre des commandes non conforme');
            assert.ok(capUi.columns.includes('repeat(2,'),'Grille commandes : deux colonnes attendues');
            assert.equal(capUi.gap,'10px','Espacement des commandes non harmonise');
            assert.equal(capUi.finish,'finishbtn','Bouton Terminer non conforme');
            assert.equal(capUi.abandon,'danger','Bouton Abandonner non conforme');
            // Geometrie reelle en viewport mobile : deux lignes, deux colonnes, tailles egales.
            await p.setViewportSize({width:390,height:844});
            const capMobile=await p.evaluate(()=>{
              const host=document.createElement('div');
              host.style.cssText='width:100%;box-sizing:border-box;padding:12px';
              host.innerHTML=milftCapUnifiedHeader({name:'Coupe test',closed:false},'Course aux points','0/6 relais','capClose()','Terminer');
              document.body.append(host);
              const boxes=[...host.querySelectorAll('.milft-cap-actions button')].map(b=>{
                const r=b.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height,right:r.right};
              });
              host.remove();
              return boxes;
            });
            assert.equal(capMobile.length,4,'Quatre commandes attendues sur mobile');
            assert.ok(capMobile.every(b=>b.width>80&&b.height>0&&b.right<=390),'Commandes mobiles hors ecran');
            assert.ok(Math.abs(capMobile[0].y-capMobile[1].y)<2,'Premiere ligne mal alignee');
            assert.ok(Math.abs(capMobile[2].y-capMobile[3].y)<2,'Terminer/Abandonner non alignes');
            assert.ok(capMobile[2].y>capMobile[0].y,'Terminer/Abandonner doivent etre en deuxieme ligne');
            assert.ok(Math.max(...capMobile.map(b=>b.width))-Math.min(...capMobile.map(b=>b.width))<2,'Largeurs des commandes incoherentes');
            await p.setViewportSize({width:1280,height:720});
            // Course aux points : une table ou un club ne peut etre affecte deux fois.
            const capTables=await p.evaluate(()=>{
              const t={
                closed:false,tables:[{id:1,state:'free'},{id:2,state:'free'},{id:3,state:'excluded'}],
                cap:{competition:true,phase:'league',matches:[
                  {id:'m1',phase:'league',a:'A',b:'B',status:'waiting',tableId:null},
                  {id:'m2',phase:'league',a:'A',b:'C',status:'waiting',tableId:null},
                  {id:'m3',phase:'league',a:'D',b:'E',status:'waiting',tableId:null}
                ]}
              };
              const originalActive=active,originalSave=save,originalFlash=flash;
              try{
                active=()=>t;save=()=>{};flash=()=>{};
                capAutoAssign();
                return t.cap.matches.map(m=>({id:m.id,tableId:m.tableId}));
              }finally{active=originalActive;save=originalSave;flash=originalFlash}
            });
            assert.deepEqual(capTables,[{id:'m1',tableId:1},{id:'m2',tableId:null},{id:'m3',tableId:2}],
              'Attribution : un club ne doit pas jouer sur deux tables, table exclue interdite');
            // Import selectif annuel : controles et presence du parcours sans ecraser l'existant.
            const mergeUi=await p.evaluate(()=>{
              const input=document.getElementById('milft-annual-merge-file');
              const btn=[...document.querySelectorAll('button')].find(b=>b.textContent.includes('Intégrer un championnat annuel'));
              return {input:!!input,accept:input?.accept,handler:input?.getAttribute('onchange'),button:!!btn,fn:typeof milftMergeAnnualBackup};
            });
            assert.equal(mergeUi.input,true,'Champ de fichier import selectif absent');
            assert.match(mergeUi.accept,/json/,'Import selectif : JSON attendu');
            assert.equal(mergeUi.handler,'milftMergeAnnualBackup(this)','Import selectif mal relie');
            assert.equal(mergeUi.button,true,'Bouton import selectif absent');
            assert.equal(mergeUi.fn,'function','Fonction import selectif absente');
            // Simulation complete de fusion : conserver les donnees locales et ignorer les doublons.
            const mergeResult=await p.evaluate(async()=>{
              const snapshot=JSON.parse(JSON.stringify(db));
              const oldConfirm=window.confirm,oldAlert=window.alert,oldPreserve=milftPreserverAvantRestauration;
              const saved=[];
              try{
                db={...snapshot,players:[{id:'local',first:'Locale',last:'GARDEE'}],
                  tournaments:[{id:'existing',mode:'challenge',name:'Saison existante',roster:[],matches:[],tables:[]}]};
                window.confirm=()=>true;window.alert=msg=>{saved.push(String(msg))};
                milftPreserverAvantRestauration=async()=>({protectedId:'test-secours'});
                const source={format:'MILFT-TOURNOIS-BACKUP',version:1,data:{
                  players:[{id:'local',first:'Locale',last:'GARDEE'},{id:'new',first:'Nouvelle',last:'JOUEUSE'}],
                  tournaments:[
                    {id:'existing',mode:'challenge',name:'Saison existante',roster:[],matches:[],tables:[]},
                    {id:'incoming',mode:'challenge',name:'Saison importee',
                     roster:[{id:'new',first:'Nouvelle',last:'JOUEUSE'}],matches:[],tables:[{id:1,state:'free'}]}
                  ]}};
                const file=new File([JSON.stringify(source)],'championnat.json',{type:'application/json'});
                await milftMergeAnnualBackup({files:[file],value:'championnat.json'});
                const first={ids:db.tournaments.map(t=>t.id),players:db.players.map(x=>x.id)};
                await milftMergeAnnualBackup({files:[file],value:'championnat.json'});
                return {first,secondIds:db.tournaments.map(t=>t.id),alerts:saved};
              }finally{
                db=snapshot;save();
                window.confirm=oldConfirm;window.alert=oldAlert;
                milftPreserverAvantRestauration=oldPreserve;
              }
            });
            assert.deepEqual(mergeResult.first.ids,['existing','incoming'],'Import : preservation des tournois ou ajout incorrect');
            assert.deepEqual(mergeResult.first.players,['local','new'],'Import : preservation ou ajout des joueurs incorrect');
            assert.deepEqual(mergeResult.secondIds,['existing','incoming'],'Import repete : doublon de championnat');
            assert.ok(mergeResult.alerts.some(x=>x.includes('existent déjà')),'Import repete : avertissement manquant');
            // Import selectif : rejeter les fichiers invalides et les collisions de joueurs sans modifier les donnees.
            const mergeSafety=await p.evaluate(async()=>{
              const snapshot=JSON.parse(JSON.stringify(db));
              const alerts=[],oldAlert=window.alert;
              try{
                db={...snapshot,players:[{id:'same',first:'Alice',last:'EXISTANTE'}],tournaments:[]};
                window.alert=msg=>alerts.push(String(msg));
                const run=async source=>{
                  const file=new File([JSON.stringify(source)],'test.json',{type:'application/json'});
                  await milftMergeAnnualBackup({files:[file],value:'test.json'});
                  return JSON.stringify(db);
                };
                const before=JSON.stringify(db);
                const invalid=await run({format:'AUTRE',version:1,data:{players:[],tournaments:[]}});
                const conflict=await run({format:'MILFT-TOURNOIS-BACKUP',version:1,data:{
                  players:[{id:'same',first:'Autre',last:'PERSONNE'}],
                  tournaments:[{id:'new',mode:'challenge',name:'Saison',roster:[],matches:[],tables:[]}]
                }});
                return {sameInvalid:invalid===before,sameConflict:conflict===before,alerts};
              }finally{db=snapshot;save();window.alert=oldAlert}
            });
            assert.ok(mergeSafety.sameInvalid,'Import invalide : donnees modifiees');
            assert.ok(mergeSafety.sameConflict,'Conflit joueur : donnees modifiees');
            assert.ok(mergeSafety.alerts.some(x=>x.includes('non reconnue')),'Import invalide : refus absent');
            assert.ok(mergeSafety.alerts.some(x=>x.includes('Conflit de fiche joueur')),'Conflit joueur : refus absent');
            // Un joueur reference mais absent du repertoire ne doit pas etre importe.
            const missingPlayer=await p.evaluate(async()=>{
              const snapshot=JSON.parse(JSON.stringify(db)),oldAlert=window.alert;
              const alerts=[];
              try{
                db={...snapshot,players:[],tournaments:[]};
                window.alert=msg=>alerts.push(String(msg));
                const source={format:'MILFT-TOURNOIS-BACKUP',version:1,data:{
                  players:[],
                  tournaments:[{id:'annual-orphan',mode:'challenge',name:'Saison orpheline',
                    roster:[{id:'absent',first:'Joueur',last:'ABSENT'}],
                    matches:[],tables:[{id:1,state:'free'}]}]
                }};
                const before=JSON.stringify(db);
                const file=new File([JSON.stringify(source)],'orphelin.json',{type:'application/json'});
                await milftMergeAnnualBackup({files:[file],value:'orphelin.json'});
                return {unchanged:JSON.stringify(db)===before,alerts};
              }finally{db=snapshot;save();window.alert=oldAlert}
            });
            assert.ok(missingPlayer.unchanged,'Import joueur manquant : donnees modifiees');
            assert.ok(missingPlayer.alerts.some(x=>x.includes('Joueur manquant')),'Import joueur manquant : refus absent');
            // Si la sauvegarde de secours echoue, l'import doit rester strictement sans effet.
            const failedProtection=await p.evaluate(async()=>{
              const snapshot=JSON.parse(JSON.stringify(db));
              const oldConfirm=window.confirm,oldAlert=window.alert,oldPreserve=milftPreserverAvantRestauration;
              const alerts=[];
              try{
                db={...snapshot,players:[],tournaments:[]};
                window.confirm=()=>true;window.alert=msg=>alerts.push(String(msg));
                milftPreserverAvantRestauration=async()=>{throw Error('Secours indisponible')};
                const source={format:'MILFT-TOURNOIS-BACKUP',version:1,data:{
                  players:[],tournaments:[{id:'annual-protected',mode:'challenge',name:'Saison',
                    roster:[],matches:[],tables:[{id:1,state:'free'}]}]}};
                const before=JSON.stringify(db);
                const file=new File([JSON.stringify(source)],'secours.json',{type:'application/json'});
                await milftMergeAnnualBackup({files:[file],value:'secours.json'});
                return {unchanged:JSON.stringify(db)===before,alerts};
              }finally{
                db=snapshot;save();window.confirm=oldConfirm;window.alert=oldAlert;
                milftPreserverAvantRestauration=oldPreserve;
              }
            });
            assert.ok(failedProtection.unchanged,'Echec sauvegarde de secours : donnees modifiees');
            assert.ok(failedProtection.alerts.some(x=>x.includes('Secours indisponible')),'Echec sauvegarde de secours : erreur non signalee');
            // Meme ID de saison mais donnees divergentes : jamais ignorer ou remplacer silencieusement.
            const divergentSeason=await p.evaluate(async()=>{
              const snapshot=JSON.parse(JSON.stringify(db)),oldAlert=window.alert;
              const alerts=[];
              try{
                db={...snapshot,players:[],tournaments:[{id:'season-1',mode:'challenge',name:'Saison locale',
                  roster:[],matches:[{id:'result-1',status:'done',sets:[]}],tables:[]}]};
                window.alert=msg=>alerts.push(String(msg));
                const source={format:'MILFT-TOURNOIS-BACKUP',version:1,data:{
                  players:[],tournaments:[{id:'season-1',mode:'challenge',name:'Saison locale',
                    roster:[],matches:[],tables:[]}]}};
                const before=JSON.stringify(db);
                const file=new File([JSON.stringify(source)],'divergent.json',{type:'application/json'});
                await milftMergeAnnualBackup({files:[file],value:'divergent.json'});
                return {unchanged:JSON.stringify(db)===before,alerts};
              }finally{db=snapshot;save();window.alert=oldAlert}
            });
            assert.ok(divergentSeason.unchanged,'Saison divergente : donnees modifiees');
            assert.ok(divergentSeason.alerts.some(x=>x.includes('déjà présent mais différent')),'Saison divergente : refus absent');
            // La fusion doit conserver les metadonnees de seances, presences et resultats sans les transformer.
            const preservedAnnual=await p.evaluate(async()=>{
              const snapshot=JSON.parse(JSON.stringify(db));
              const oldConfirm=window.confirm,oldAlert=window.alert,oldPreserve=milftPreserverAvantRestauration;
              try{
                db={...snapshot,players:[],tournaments:[]};
                window.confirm=()=>true;window.alert=()=>{};
                milftPreserverAvantRestauration=async()=>({protectedId:'test-secours'});
                const season={id:'season-metadata',mode:'challenge',name:'Championnat test',
                  roster:[{id:'p1',first:'A',last:'TEST'},{id:'p2',first:'B',last:'TEST'}],
                  matches:[{id:'m1',a:'p1',b:'p2',status:'done',sets:[[5,3],[5,2],[5,4]],winner:'p1'}],
                  tables:[{id:1,state:'free'}],
                  sessions:[{id:'s1',date:'2026-11-05',present:['p1'],absent:['p2']}],
                  attendance:{s1:['p1']},customSeasonField:{preserve:true}};
                const source={format:'MILFT-TOURNOIS-BACKUP',version:1,data:{
                  players:[{id:'p1',first:'A',last:'TEST'},{id:'p2',first:'B',last:'TEST'}],
                  tournaments:[season]}};
                const file=new File([JSON.stringify(source)],'seances.json',{type:'application/json'});
                await milftMergeAnnualBackup({files:[file],value:'seances.json'});
                return {same:JSON.stringify(db.tournaments[0])===JSON.stringify(season),
                  players:db.players.length};
              }finally{
                db=snapshot;save();window.confirm=oldConfirm;window.alert=oldAlert;
                milftPreserverAvantRestauration=oldPreserve;
              }
            });
            assert.ok(preservedAnnual.same,'Fusion : metadonnees de saison ou resultats modifies');
            assert.equal(preservedAnnual.players,2,'Fusion : joueurs de saison manquants');
            // Attribution manuelle CAP : une table occupee ne peut etre attribuee deux fois.
            const capManualConflict=await p.evaluate(()=>{
              const snapshot=JSON.parse(JSON.stringify(db)),oldAlert=window.alert;
              const alerts=[];
              try{
                const matches=[{id:'cap-1',a:'club-a',b:'club-b',status:'waiting',tableId:1},
                  {id:'cap-2',a:'club-c',b:'club-d',status:'waiting',tableId:null}];
                db={...snapshot,selected:'cap-test',tournaments:[{
                  id:'cap-test',mode:'cap',closed:false,
                  tables:[{id:1,state:'free'},{id:2,state:'free'}],
                  cap:{competition:true,phase:'league',matches}
                }]};
                window.alert=msg=>alerts.push(String(msg));
                const select=document.createElement('select');
                select.id='cap-table-cap-2';select.innerHTML='<option value="1" selected>Table 1</option>';
                document.body.appendChild(select);
                try{capAssignTable('cap-2')}finally{select.remove()}
                return {first:matches[0].tableId,second:matches[1].tableId,alerts};
              }finally{db=snapshot;save();window.alert=oldAlert}
            });
            assert.equal(capManualConflict.first,1,'Attribution manuelle CAP : premiere table modifiee');
            assert.equal(capManualConflict.second,null,'Attribution manuelle CAP : double attribution autorisee');
            assert.ok(capManualConflict.alerts.some(x=>x.includes('déjà attribuée')),'Attribution manuelle CAP : refus absent');
            // CAP : attribution manuelle valide, refus table exclue et persistance apres rechargement.
            const capManualPaths=await p.evaluate(()=>{
              const original=JSON.parse(JSON.stringify(db)),oldAlert=window.alert;
              const warnings=[];
              const select=document.createElement('select');
              select.id='cap-table-cap-m';select.innerHTML='<option value="1">1</option><option value="2">2</option>';
              document.body.appendChild(select);
              try{
                const match={id:'cap-m',a:'a',b:'b',status:'waiting',tableId:null};
                db={...original,selected:'cap-manual-check',tournaments:[{
                  id:'cap-manual-check',mode:'cap',closed:false,matches:[],roster:[],
                  tables:[{id:1,state:'excluded'},{id:2,state:'free'}],
                  cap:{competition:true,phase:'league',matches:[match]}
                }]};
                window.alert=x=>warnings.push(String(x));
                select.value='1';capAssignTable('cap-m');
                const excluded=match.tableId;
                select.value='2';capAssignTable('cap-m');
                const valid=match.tableId;
                const persisted=JSON.parse(localStorage.getItem(KEY)).tournaments[0].cap.matches[0].tableId;
                return {excluded,valid,persisted,warnings};
              }finally{select.remove();db=original;save();window.alert=oldAlert}
            });
            assert.equal(capManualPaths.excluded,null,'CAP : table exclue attribuee');
            assert.equal(capManualPaths.valid,2,'CAP : table libre non attribuee');
            assert.equal(capManualPaths.persisted,2,'CAP : attribution non sauvegardee');
            assert.ok(capManualPaths.warnings.some(x=>x.includes('exclue')),'CAP : refus table exclue non signale');
            // Course aux points : scores cumules, paliers, correction et cloture.
            const relayChecks=await p.evaluate(()=>{
              const original=JSON.parse(JSON.stringify(db)),oldAlert=window.alert,oldConfirm=window.confirm;
              const warnings=[];
              const a=document.createElement('input'),b=document.createElement('input');
              a.id='cap-a';b.id='cap-b';document.body.append(a,b);
              try{
                db={...original,selected:'relay-ci',tournaments:[{
                  id:'relay-ci',name:'Relais CI',mode:'cap',closed:false,matches:[],roster:[],
                  tables:[],cap:{teamA:'A',teamB:'B',targets:[5,10],types:['S','D'],
                    relays:[],scoreMode:'cumulative',finish:'winner'}
                }]};
                window.alert=x=>warnings.push(String(x));window.confirm=()=>true;
                a.value='4';b.value='0';capRecord();
                const refusedFirst=db.tournaments[0].cap.relays.length;
                a.value='5';b.value='3';capRecord();
                const first=JSON.stringify(db.tournaments[0].cap.relays);
                a.value='4';b.value='10';capRecord();
                const refusedDecrease=db.tournaments[0].cap.relays.length;
                a.value='8';b.value='10';capRecord();
                const complete=db.tournaments[0].cap.relays.length;
                capEdit(1);
                const afterCorrection=db.tournaments[0].cap.relays.length;
                capClose();
                const refusedClose=db.tournaments[0].closed;
                return {refusedFirst,first,refusedDecrease,complete,afterCorrection,refusedClose,warnings};
              }finally{a.remove();b.remove();db=original;save();window.alert=oldAlert;window.confirm=oldConfirm}
            });
            assert.equal(relayChecks.refusedFirst,0,'CAP : palier non atteint accepte');
            assert.equal(relayChecks.first,JSON.stringify([{a:5,b:3}]),'CAP : premier relais incorrect');
            assert.equal(relayChecks.refusedDecrease,1,'CAP : diminution de score acceptee');
            assert.equal(relayChecks.complete,2,'CAP : second relais non enregistre');
            assert.equal(relayChecks.afterCorrection,1,'CAP : correction du dernier relais impossible');
            assert.equal(relayChecks.refusedClose,false,'CAP : cloture prematuree autorisee');
            // Course aux points : une rencontre terminee se cloture puis peut etre rouverte.
            const capCloseCompleted=await p.evaluate(()=>{
              const original=JSON.parse(JSON.stringify(db)),oldAlert=window.alert;
              try{
                db={...original,selected:'cap-close-ci',tournaments:[{
                  id:'cap-close-ci',name:'CAP termine',mode:'cap',closed:false,matches:[],roster:[],
                  tables:[],cap:{teamA:'A',teamB:'B',targets:[5,10],types:['S','D'],
                    relays:[{a:5,b:3},{a:10,b:8}],scoreMode:'cumulative',finish:'winner'}
                }]};
                window.alert=()=>{};
                capClose();const closed=db.tournaments[0].closed;
                capClose();const reopened=db.tournaments[0].closed;
                return {closed,reopened};
              }finally{db=original;save();window.alert=oldAlert}
            });
            assert.equal(capCloseCompleted.closed,true,'CAP : cloture d une rencontre terminee impossible');
            assert.equal(capCloseCompleted.reopened,false,'CAP : reouverture d une rencontre impossible');
            // Championnat CAP : refus de cloture tant qu une rencontre reste en attente.
            const capLeagueClose=await p.evaluate(()=>{
              const original=JSON.parse(JSON.stringify(db)),oldAlert=window.alert;
              const alerts=[];
              try{
                db={...original,selected:'cap-league-ci',tournaments:[{
                  id:'cap-league-ci',name:'Ligue CAP',mode:'cap',closed:false,matches:[],roster:[],
                  tables:[],cap:{competition:true,structure:'league',phase:'league',bracket:false,
                    matches:[{id:'fixture-1',status:'waiting',relays:[],a:'a',b:'b'}]}
                }]};
                window.alert=x=>alerts.push(String(x));
                capCompClose();const blocked=db.tournaments[0].closed;
                db.tournaments[0].cap.matches[0].status='done';
                capCompClose();const missingScoreBlocked=db.tournaments[0].closed;
                db.tournaments[0].cap.matches[0].relays=[{a:30,b:20}];
                capCompClose();const closed=db.tournaments[0].closed;
                return {blocked,missingScoreBlocked,closed,alerts};
              }finally{db=original;save();window.alert=oldAlert}
            });
            // Garde-fous de livraison : archives BYE incompletes et phases vides.
            const capEdgeCases=await p.evaluate(()=>{
              const original=db,oldAlert=window.alert,oldFlash=flash,alerts=[];
              try{
                window.alert=x=>alerts.push(String(x));flash=()=>{};
                const empty={id:'cap-empty',name:'Coupe vide',mode:'cap',closed:false,roster:[],matches:[],tables:[{id:1,state:'free'}],cap:{competition:true,structure:'cup',phase:'groups',bracket:true,pools:[['a','b']],qualifiers:1,matches:[],clubs:[{id:'a',name:'A'},{id:'b',name:'B'}]}};
                db={players:[],selected:'cap-empty',tournaments:[empty]};
                capCompClose();const emptyClosed=empty.closed;
                capCompNext();const emptyPhase=empty.cap.phase;
                const invalidBye=capCompScore({bye:true,score:null});
                const validBye=capCompScore({bye:true,score:{a:30,b:20}});
                return {emptyClosed,emptyPhase,invalidBye,validBye,alerts};
              }finally{db=original;window.alert=oldAlert;flash=oldFlash;}
            });
            assert.equal(capEdgeCases.emptyClosed,false,'CAP : cloture de competition vide autorisee');
            assert.equal(capEdgeCases.emptyPhase,'groups','CAP : transition de phase vide autorisee');
            assert.equal(capEdgeCases.invalidBye,null,'CAP : BYE sans score non detecte');
            assert.deepEqual(capEdgeCases.validBye,{a:30,b:20},'CAP : BYE valide non reconnu');
            assert.ok(capEdgeCases.alerts.length>=2,'CAP : alertes de protection absentes');
            assert.equal(capLeagueClose.blocked,false,'Championnat CAP : cloture prematuree autorisee');
            assert.equal(capLeagueClose.missingScoreBlocked,false,'Championnat CAP : score manquant non bloque');

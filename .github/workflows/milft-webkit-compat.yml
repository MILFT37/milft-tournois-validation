name: Compatibilite WebKit V1.1 (simulation Safari)
on:
  push:
    branches: [main]
    paths:
      - 'tests/webkit-smoke.cjs'
      - 'tests/webkit-backup-ui.cjs'
      - 'tests/indexeddb-browser.cjs'
      - 'MILFT_Tournois_V1_1_VALIDATION_HEBERGEMENT_STABLE_2026-11-02.html'
      - 'manifest.webmanifest'
      - 'index.html'
      - 'MILFT_Tournois_192.png'
      - 'MILFT_Tournois_512.png'
      - '.github/workflows/milft-webkit-compat.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright WebKit
        run: |
          npm install --no-save playwright@1.56.1
          node -e "const {webkit}=require('playwright'); console.log('WebKit executable:', webkit.executablePath())"
      - name: Recette WebKit mobile isolée
        run: node tests/webkit-smoke.cjs
      - name: Export et restauration JSON reels en WebKit avec preservation IndexedDB
        env:
          MILFT_BROWSER: webkit
        run: node tests/indexeddb-browser.cjs
      - name: Export restauration reels par les boutons et selecteur WebKit
        run: node tests/webkit-backup-ui.cjs

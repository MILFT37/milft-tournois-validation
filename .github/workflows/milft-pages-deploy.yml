name: Publier V1.1 validation sur GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'MILFT_Tournois_V1_1_VALIDATION_HEBERGEMENT_STABLE_2026-11-02.html'
      - 'MILFT_Tournois_V1_1_FUSION_ANNUELLE_2026-11-06.html'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'MILFT_Tournois_192.png'
      - 'MILFT_Tournois_512.png'
      - 'MILFT_Tournois_1024.png'
      - 'milft-drive-v11-validation.js'
      - 'drive-connexion-android.html'
      - 'drive-integration-fictive.html'
      - 'sw.validation.js'
      - 'v2/mobile-demo.html'
      - 'v2/mobile-demo.mjs'
      - 'v2/firebase-config.mjs'
      - 'v2/outbox-idb.js'
      - '.github/workflows/milft-pages-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp MILFT_Tournois_V1_1_VALIDATION_HEBERGEMENT_STABLE_2026-11-02.html _site/
          cp MILFT_Tournois_V1_1_FUSION_ANNUELLE_2026-11-06.html _site/
          cp index.html manifest.webmanifest sw.validation.js milft-drive-v11-validation.js _site/
          cp drive-connexion-android.html _site/
          cp drive-integration-fictive.html _site/
          mkdir -p _site/v2
          cp v2/mobile-demo.html v2/mobile-demo.mjs v2/firebase-config.mjs v2/outbox-idb.js _site/v2/
          cp MILFT_Tournois_192.png MILFT_Tournois_512.png MILFT_Tournois_1024.png _site/
          python3 - <<'PY'
          import json, pathlib, struct
          site=pathlib.Path('_site')
          # Ne jamais republier l'annuaire nominatif codé en dur.
          for source in pathlib.Path('.').glob('MILFT_*.html'):
            assert 'MILFT_JOUEURS_REFERENCE_20261014' not in source.read_text(encoding='utf-8'), 'Annuaire public détecté : '+source.name
          stable='MILFT_Tournois_V1_1_VALIDATION_HEBERGEMENT_STABLE_2026-11-02.html'
          index=(site/'index.html').read_text(encoding='utf-8')
          assert stable in index and 'http-equiv="refresh"' in index, 'Accueil non redirigé vers V1.1 stable'
          manifest=json.loads((site/'manifest.webmanifest').read_text(encoding='utf-8'))
          start=manifest['start_url'].lstrip('./')
          assert start==stable and (site/start).is_file(), 'Point de départ PWA absent'
          icons=manifest['icons']
          assert {'192x192','512x512'}.issubset({i['sizes'] for i in icons}), 'Icônes PWA obligatoires manquantes'
          for icon in icons:
            image=site/icon['src'].lstrip('./')
            with image.open('rb') as f:
              header=f.read(24)
            assert header[:8]==b'\x89PNG\r\n\x1a\n', f'PNG non reconnu: {image}'
            w,h=struct.unpack('>II',header[16:24])
            expected=tuple(map(int,icon['sizes'].split('x')))
            assert (w,h)==expected, f'Dimensions d’icône incohérentes: {image} {w}x{h}'
          assert all((site/filename).is_file() for filename in ['v2/mobile-demo.html','v2/mobile-demo.mjs','v2/firebase-config.mjs','v2/outbox-idb.js']), 'Prototype V2 isolé incomplet'
          config=(site/'v2/firebase-config.mjs').read_text(encoding='utf-8')
          assert 'export const firebaseConfig = {' in config and 'firebaseConfig = null' not in config, 'Configuration Firebase V2 non active'
          assert 'milft-tournois-partage-55e44' in config and 'milft-tournois-partage-55e44-default-rtdb.europe-west1.firebasedatabase.app' in config, 'Projet ou base Firebase non conformes au compte du club'
          assert "v2Trials/" in (site/'v2/mobile-demo.mjs').read_text(encoding='utf-8'), 'Le prototype doit rester sur les essais fictifs V2 uniquement'
          html=(site/stable).read_text(encoding='utf-8')
          assert 'milft-drive-v11-validation.js' in html, 'Module Drive absent du HTML'
          assert 'sw.validation.js' in html, 'Service worker absent du HTML'
          module=(site/'milft-drive-v11-validation.js').read_text(encoding='utf-8')
          assert 'MILFTDriveV11Core' in module, 'Module Drive invalide'
          assert 'manifest.webmanifest' in html and 'MILFT_Tournois_192.png' in html, 'Liens PWA absents du HTML'
          print('OK artefact Pages : accueil V1.1 stable, manifeste, 192/512 PNG et HTML présents')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # API GitHub Pages: éviter la course entre l'upload réussi et la
      # propagation des métadonnées de l'artefact jusqu'au service Pages.
      - name: Attendre la visibilité de l'artefact de cette exécution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            count=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GH_REPOSITORY/actions/runs/$GH_RUN_ID/artifacts?per_page=100" \
              | python3 -c "import json,sys; print(sum(a.get('name')=='github-pages' and not a.get('expired',False) for a in json.load(sys.stdin).get('artifacts',[])))")
            echo "Artefact github-pages visible : $count (essai $attempt)"
            if [ "$count" = "1" ]; then exit 0; fi
            if [ "$count" -gt 1 ]; then echo "::error::Artefacts Pages dupliqués"; exit 1; fi
            sleep 5
          done
          echo "::error::Artefact Pages introuvable après upload"
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4

  verifier_site_public:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le site public et les octets de la version candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, time, urllib.request
          base='https://milft37.github.io/milft-tournois-validation/'
          files=[
            'index.html',
            'manifest.webmanifest',
            'sw.validation.js',
            'milft-drive-v11-validation.js',
            'drive-connexion-android.html',
            'drive-integration-fictive.html',
            'v2/mobile-demo.html',
            'v2/mobile-demo.mjs',
            'v2/firebase-config.mjs',
            'v2/outbox-idb.js',
            'MILFT_Tournois_192.png',
            'MILFT_Tournois_512.png',
            'MILFT_Tournois_1024.png',
            'MILFT_Tournois_V1_1_VALIDATION_HEBERGEMENT_STABLE_2026-11-02.html',
            'MILFT_Tournois_V1_1_FUSION_ANNUELLE_2026-11-06.html',
          ]
          for name in files:
            expected=hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
            last=''
            for attempt in range(12):
              try:
                url=base+name+'?milft-verify='+str(attempt)+'-'+expected[:10]
                request=urllib.request.Request(url,headers={'User-Agent':'MILFT-Validation-Deploy-Check/1.0','Cache-Control':'no-cache'})
                with urllib.request.urlopen(request,timeout=25) as response:
                  actual=hashlib.sha256(response.read()).hexdigest()
                  status=response.status
                if status==200 and actual==expected:
                  print(f'OK public : {name} (HTTP 200, SHA-256 conforme)')
                  break
                last=f'HTTP {status}; sha={actual[:12]} au lieu de {expected[:12]}'
              except Exception as exc:
                last=type(exc).__name__+': '+str(exc)
              if attempt<11:time.sleep(5)
            else:
              raise RuntimeError('Page distante non vérifiée '+name+' : '+last)
          print('OK : GitHub Pages diffuse exactement les fichiers de validation du dépôt')
          PY

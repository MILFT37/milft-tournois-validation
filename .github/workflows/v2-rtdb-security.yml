name: V2.0 — sécurité Firebase RTDB (émulateur isolé)
on:
  push:
    branches: [main]
    paths:
      - 'v2/database.rules.json'
      - 'v2/firebase-match-transport.cjs'
      - 'tests/v2-rtdb-security.cjs'
      - 'tests/v2-rtdb-transport-integration.cjs'
      - 'firebase.v2.emulator.json'
      - '.github/workflows/v2-rtdb-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Installer Firebase Emulator et bibliothèque de tests
        run: npm install --no-save firebase-tools@14.17.0 @firebase/rules-unit-testing@5.0.0 firebase@12.6.0
      - name: Vérifier le JSON des règles
        run: node -e "JSON.parse(require('fs').readFileSync('v2/database.rules.json'))"
      - name: Tester les règles contre Firebase Emulator uniquement (aucun projet réel)
        run: npx firebase --config firebase.v2.emulator.json --project demo-milft-v2-70 emulators:exec --only database "node tests/v2-rtdb-security.cjs && node tests/v2-rtdb-transport-integration.cjs"
